function tableCot(){
  const ex = DB.params.exercice, q = norm($('#cq').value), mf = $('#cmufid').value, et = $('#cetat').value;
  let l = DB.adherents.filter(a=>{
    if(mf && a.mufid!==mf) return false;
    const c = R.cot(a,ex), du = R.cotisationDue(a), p = (c||{}).paye||0;
    if(et==='non' && p>0) return false; if(et==='oui' && p<du) return false; if(et==='part' && !(p>0&&p<du)) return false;
    if(q && !norm([a.nom,a.prenom,a.raisonSociale,a.matricule,a.compte].join(' ')).includes(q)) return false;
    return true;
  });
  $('#ccompte').textContent = nb(l.length)+' ligne(s)';
  $('#tCot').innerHTML = `<div class="tab-enrob"><table class="t"><thead><tr>
    <th class="nc">Adhérent</th><th class="nc">Cat.</th><th class="nc">MUFID</th><th class="nc">Payeur (art. 9)</th>

    ${l.slice(0,400).map(a=>{ const c=R.cot(a,ex)||{}, du=R.cotisationDue(a), p=c.paye||0;
      return `<tr><td>${esc(R.nomComplet(a))}<div class="disc">${esc(a.matricule||a.compte||'')}</div></td>
      <td><span class="et neu">${CATEGORIES[a.categorie].court}</span></td><td>${esc(a.mufid||'')}</td>
      <td class="disc">${CATEGORIES[a.categorie].payeur}</td>

      <td>${p>=du?'<span class="et ok">Soldée</span>':p>0?'<span class="et att">Partielle</span>':'<span class="et ko">Non payée</span>'}</td>
      <td><button class="btn s mini" data-enc="${a.id}">Encaisser</button></td></tr>`;}).join('')}

  $$('#tCot [data-enc]').forEach(b=>b.onclick=()=>{ if(AC.gardien('cotisation.encaisser')) encaisser(b.dataset.enc); });
}

function prelevementAuto(){
  const ex = DB.params.exercice; let ok=0, ko=0, dejà=0;
  DB.adherents.filter(a=>a.categorie===3 && a.statut==='actif').forEach(a=>{
    const du = R.cotisationDue(a); a.cot=a.cot||{};
    if((a.cot[ex]||{}).paye>=du){ dejà++; return; }
    if((a.solde||0) >= Math.max(du, DB.params.provisionMin)){
      a.solde -= du; a.cot[ex]={du,paye:du,date:auj(),mode:'Prélèvement automatique',payeur:'Le membre'};
      tresor('Prélèvement '+ex+' — '+R.nomComplet(a), du, auj()); ok++;
    } else { a.statut='suspendu'; a.motif='Compte non provisionné au prélèvement annuel (art. 12.3)'; ko++; }
  });
  journal('Prélèvement automatique', `${ok} prélevé(s), ${ko} suspendu(s)`);
  sauver(true);
  modale('Prélèvement automatique exécuté', `<div class="note vert"><b>${ok} cotisation(s) prélevée(s)</b>Exercice ${ex}, ${fcfa(ok*DB.params.cotisation.c3)} encaissés.</div>
    ${ko? `<div class="note rouge"><b>${ko} couverture(s) suspendue(s)</b>Comptes ne disposant pas de la provision de ${fcfa(DB.params.provisionMin)} au moment du prélèvement (art. 12.3). La suspension doit être notifiée aux membres concernés.</div>`:''}
    ${dejà? `<div class="note"><b>${dejà} adhérent(s) déjà à jour</b>Le principe d'unicité de la cotisation empêche un second débit (art. 10.1).</div>`:''}`,
    [{t:'Fermer', cl:'', f:()=>rendCotisations()}]);
}
function tresor(lib, montant, date, sens){
  DB.tresorerie.push({id:uid('t'), date:date||auj(), lib, montant:(sens==='debit'?-1:1)*montant});
}
function doublons(){
  const m = {};
  DB.adherents.forEach(a=>{
    const k = (a.cni&&norm(a.cni)) || (norm(R.nomComplet(a))+'|'+(a.dateNaissance||''));
    (m[k]=m[k]||[]).push(a);
  });
  const ex = DB.params.exercice;
  return Object.values(m).filter(l=>l.length>1 && l.filter(a=>((R.cot(a,ex)||{}).paye||0)>0).length>1);
}
function traiterDoublons(){
  const d = doublons(), ex = DB.params.exercice;
  modale('Trop-perçus à reverser (art. 10.2)', d.map(l=>{
    const payes = l.filter(a=>((R.cot(a,ex)||{}).paye||0)>0);
    const garde = tri(payes,a=>-R.capital(a),1)[0];
    const rendus = payes.filter(a=>a.id!==garde.id);
    return `<fieldset><legend>${esc(R.teteAssuree(l[0]))}</legend>
      ${l.map(a=>lg(R.nomComplet(a)+' — '+CATEGORIES[a.categorie].court, fcfa((R.cot(a,ex)||{}).paye||0) + (a.id===garde.id?' — cotisation conservée':' — à reverser'))).join('')}
      <div class="disc">Reversement automatique et sans frais de ${fcfa(rendus.reduce((s,a)=>s+((R.cot(a,ex)||{}).paye||0),0))}.</div></fieldset>`;
  }).join('') || '<div class="vide">Aucun doublon détecté</div>', [
    {t:'Fermer'},
    {t:'Reverser les trop-perçus', cl:'v', f:()=>{
      let tot=0;
      d.forEach(l=>{ const payes=l.filter(a=>((R.cot(a,ex)||{}).paye||0)>0); const garde=tri(payes,a=>-R.capital(a),1)[0];
        payes.filter(a=>a.id!==garde.id).forEach(a=>{ const mt=(R.cot(a,ex)||{}).paye||0; tot+=mt;
          a.solde=(a.solde||0)+mt; a.cot[ex]={du:R.cotisationDue(a),paye:0,date:null,mode:'Trop-perçu reversé',payeur:null};
          tresor('Reversement trop-perçu — '+R.nomComplet(a), mt, auj(), 'debit'); }); });
      journal('Reversement trop-perçus', fcfa(tot)); sauver(true); toast('Trop-perçus reversés : '+fcfa(tot),'ok'); rendCotisations();
    }}]);
}

/* évaluation réglementaire d'un sinistre */
function evalSinistre(a, dateDeces, exclusion, cause){
  const det = [], ex = new Date(dateDeces).getFullYear() || DB.params.exercice;
  const st = R.statut(a, dateDeces, ex);
  const accident = /accident/i.test(cause||'');
  let recevable = true, motif = null;
  det.push(`Catégorie ${a.categorie} — ${R.libFonction(a)} · barème ${fcfa(R.capital(a))}`);
  if(exclusion){ recevable=false; motif=EXCLUSIONS[exclusion]; det.push('Exclusion de garantie : '+EXCLUSIONS[exclusion]); }
  if(!R.eligible(a)){ recevable=false; motif=motif||"Adhésion irrégulière : 60 ans ou plus à l'adhésion (art. 12.1)"; det.push(motif); }
  if(!R.payee(a,ex)){ recevable=false; motif=motif||"Cotisation "+ex+" non soldée à la date du décès (art. 2)"; det.push("Cotisation de l'exercice non soldée : l'adhérent doit être à jour à la date du décès."); }
  const fc = R.finCarence(a);
  if(fc && dateDeces < fc){
    if(accident && DB.params.couvreAccidentEnCarence){ det.push(`Décès en période d'attente mais de cause accidentelle : la garantie joue (art. 3).`); }
    else { recevable=false; motif=motif||`Décès survenu pendant la période d'attente, garantie effective le ${jour(fc)} (art. 13)`; det.push(motif); }
  } else if(fc) det.push(`Période d'attente achevée le ${jour(fc)}.`);
  const ind = R.indemnite(a);
  if(ind.ecartes.length) det.push(`Non-cumul (art. 17) : ${ind.ecartes.length} autre(s) compte(s) rattaché(s) à la même tête assurée — seule l'indemnité la plus élevée est versée.`);
  if(a.typePersonne==='morale') det.push(`Personne morale : tête assurée ${R.teteAssuree(a)} (art. 18).`);
  return {recevable, motif, montant: recevable? ind.montant : 0, details:det, statutAuDeces:st.lib};
}

      if(s.statut==='paye' || (s.paiement && s.datePaiement)){ toast('Ce sinistre est déjà réglé — aucun second débit possible','ko'); return false; }
      if(s.statut==='rejete'){ toast('Dossier rejeté : aucun paiement possible','ko'); return false; }
      if(!(s.niveau1&&s.niveau1.vise)){ toast('Visas du Comité Local de Validation requis (art. 23.1)','ko'); return false; }
      if(!(s.niveau2&&s.niveau2.valide&&s.niveau2.signatures)){ toast('Validation du Directeur Général requise (art. 23.2)','ko'); return false; }
      const dg=$('#sigDg').checked, autres=[$('#sigPc').checked,$('#sigAdm').checked].filter(Boolean).length;
      if(!dg){ toast('La signature du Directeur Général est indispensable au décaissement (art. 28)','ko'); return false; }
      if(dg+autres < 2){ toast('Double signature conjointe requise : DG + un second signataire (art. 28)','ko'); return false; }
      s.paiement = {date:$('#pDate').value, mode:$('#pMode').value, beneficiaire:$('#pBen').value,
        sigDg:dg, sigPc:$('#sigPc').checked, sigAdm:$('#sigAdm').checked};
      s.datePaiement = $('#pDate').value; s.statut='paye'; s.decharge={signee:true,date:$('#pDate').value};
      tresor('Indemnité décès — '+s.nomAssure, s.montant, s.datePaiement, 'debit');
      journal('Paiement indemnité', s.nomAssure+' — '+fcfa(s.montant));
      sauver(true); toast('Indemnité réglée : '+fcfa(s.montant),'ok'); rendSinistres();
    }}]);
  setTimeout(remplirSpecimensSignature, 60);   // charge les spécimens de signature à la demande
}

/* Retire du référentiel les MUFID qui ne comptent aucun adhérent (entrées fantômes : démo, doublons de code). */
/* Noms de MUFID issus du jeu de démonstration : à proposer au retrait s'ils n'ont aucun adhérent. */
const MUFID_DEMO = ['mufid yaounde','mufid douala','mufid bafoussam','mufid garoua','mufid bafang','mufid bamenda','mufid kribi'];
async function nettoyerMufidsVides(){
  if(!AC.gardien('mufid.gerer')) return;
  const presentes = await mufidsPresentes(true);                 // MUFID ayant au moins un adhérent
  const codesPresents = new Set(presentes.map(m=>m.code));
  const effectif = {}; presentes.forEach(m=>{ effectif[m.code]=m.adherents; });

  // 1) MUFID sans aucun adhérent
  const vides = DB.mufids.filter(m=>!codesPresents.has(m.code));
  // 2) Doublons de NOM : même nom sous plusieurs codes → on garde celui qui a des adhérents (ou le 1er), on retire les autres vides
  const parNom = {}; DB.mufids.forEach(m=>{ const k=norm(m.nom); (parNom[k]=parNom[k]||[]).push(m); });
  const doublons = [];
  Object.values(parNom).forEach(grp=>{ if(grp.length>1){
    const gardé = grp.find(m=>codesPresents.has(m.code)) || grp[0];
    grp.forEach(m=>{ if(m!==gardé && !codesPresents.has(m.code) && !vides.includes(m)) doublons.push(m); });
  }});
  // 3) Fantômes de démonstration (nom connu + aucun adhérent)
  const demos = DB.mufids.filter(m=> MUFID_DEMO.includes(norm(m.nom)) && !codesPresents.has(m.code) && !vides.includes(m) && !doublons.includes(m));

  const aRetirer = [...vides, ...doublons, ...demos];
  if(!aRetirer.length){ toast('Référentiel déjà propre — aucune MUFID fantôme détectée','ok'); return; }
  const codesRetrait = new Set(aRetirer.map(m=>m.code));
  const ligneDetail = (liste,titre)=> liste.length? `<div style="margin-top:6px"><b>${titre} (${liste.length})</b><br><span class="disc">${liste.map(m=>esc(m.nom)+' ['+esc(m.code)+']').join(' · ')}</span></div>`:'';
  modale('Nettoyer le référentiel des MUFID', `
    <div class="note"><b>${aRetirer.length} entrée(s) à retirer :</b>

function anomalies(){
  const ex = DB.params.exercice, P = DB.params, A = {listes:[]};
  const add = (code,titre,article,gravite,lignes)=>{ if(lignes.length) A.listes.push({code,titre,article,gravite,lignes}); };
  add('age',"Adhésions irrégulières : 60 ans ou plus à la date d'adhésion",'art. 12.1','ko',
    DB.adherents.filter(a=>!R.eligible(a)).map(a=>({t:R.nomComplet(a), d:`${age(a.dateNaissance,a.dateAdhesion)} ans à l'adhésion du ${jour(a.dateAdhesion)}`, id:a.id})));
  add('prov',"Comptes non provisionnés — couverture suspendue",'art. 12.3','ko',
    DB.adherents.filter(a=>a.categorie===3 && (a.solde||0)<P.provisionMin && !R.payee(a,ex)).map(a=>({t:R.nomComplet(a), d:`Solde ${fcfa(a.solde)} pour une provision requise de ${fcfa(P.provisionMin)}`, id:a.id})));
  add('act',"Comptes sans activité réelle — risque spéculatif",'art. 12.2','att',
    DB.adherents.filter(a=>{ if(a.categorie!==3||a.ancienMembre||!a.dateAdhesion) return false;
      return ex >= new Date(a.dateAdhesion).getFullYear()+1 && (a.mouvements||0) <= R.cotisationDue(a); })
      .map(a=>({t:R.nomComplet(a), d:`Mouvements de l'exercice : ${fcfa(a.mouvements)}`, id:a.id})));
  add('imp',"Cotisations "+ex+" non soldées",'art. 9','att',
    DB.adherents.filter(a=>a.statut!=='decede'&&a.statut!=='radie'&&!R.payee(a,ex)).map(a=>({t:R.nomComplet(a), d:`${fcfa(((R.cot(a,ex)||{}).paye)||0)} encaissés sur ${fcfa(R.cotisationDue(a))}`, id:a.id})));
  add('dbl',"Têtes assurées prélevées plusieurs fois",'art. 10.2','att',
    doublons().map(l=>({t:R.teteAssuree(l[0]), d:`${l.length} comptes : ${l.map(x=>CATEGORIES[x.categorie].court).join(', ')} — trop-perçu à reverser`, id:l[0].id})));
  add('cum',"Têtes assurées détenant plusieurs comptes — non-cumul applicable",'art. 17','inf',
    (function(){ const vu=new Set(), out=[]; DB.adherents.forEach(a=>{ if(vu.has(a.id)) return; const l=R.comptesLies(a);
      if(l.length){ [a].concat(l).forEach(x=>vu.add(x.id)); out.push({t:R.teteAssuree(a), d:`${l.length+1} comptes — indemnité unique de ${fcfa(R.indemnite(a).montant)}`, id:a.id}); } }); return out; })());
  add('tete',"Personnes morales sans tête assurée désignée",'art. 18','ko',
    DB.adherents.filter(a=>a.typePersonne==='morale' && !a.personneCouverte).map(a=>({t:R.nomComplet(a), d:'Président en exercice ou promoteur principal à identifier', id:a.id})));
  add('serv',"Retraités justifiant de moins de "+P.anneesServiceMinCat2+" ans de service",'art. 9 — cat. 2','att',
    DB.adherents.filter(a=>a.categorie===2 && (a.anneesService||0)<P.anneesServiceMinCat2).map(a=>({t:R.nomComplet(a), d:`${a.anneesService||0} an(s) de service déclarés`, id:a.id})));
  add('del',"Déclarations de décès hors du délai de "+P.delaiDeclarationH+" heures",'art. 21','att',
    DB.sinistres.filter(s=>s.dateDeclaration && heuresEntre(s.dateDeces,s.dateDeclaration)>P.delaiDeclarationH)
      .map(s=>({t:s.nomAssure, d:`Déclaré ${heuresEntre(s.dateDeces,s.dateDeclaration)} h après le décès`, sin:s.id})));
  add('visa',"Dossiers réglés sans visa complet du Comité Local",'art. 24','ko',
    DB.sinistres.filter(s=>s.statut==='paye' && !(s.niveau1&&s.niveau1.vise&&s.niveau1.pointFocal&&s.niveau1.membreCS))
      .map(s=>({t:s.nomAssure, d:'Responsabilité personnelle des signataires engagée', sin:s.id})));
  add('audit',"MUFID dont la sinistralité dépasse le seuil d'audit",'art. 26','ko',
    agreger().parMufid.filter(m=>m.sp!=null && m.sp>=P.seuilCritique).map(m=>({t:m.nom, d:`Ratio S/P de ${pct(m.sp)} — audit approfondi des dossiers de sinistres`})));
  A.total = A.listes.reduce((s,l)=>s+l.lignes.length,0);
  const gr = A.listes.filter(l=>l.gravite==='ko').length;
  A.resume = `${gr} anomalie(s) bloquante(s) sur ${A.listes.length} contrôle(s) déclenché(s)`;
  return A;
}

/* Calcul des cotisations multiples (personnes cat.3 ayant cotisé dans plusieurs MUFID) */
async function calculCotisationsMultiples(){
  const ex = DB.params.exercice;
  if(Srv.actif()){
    const d = await Srv.cotisationsMultiples(ex);
    return (d && d.liste) ? d.liste.map(x=>({
      cle:x.cle, cotisations:x.cotisations, mufids:x.mufids, payeTotal:x.paye_total,
      aConserver:x.a_conserver, aRembourser:x.a_rembourser, details:(x.details||[])
    })) : [];
  }
  // mode local : regroupement par nom+prénom (TOUTES catégories), dès qu'une personne a plus d'une cotisation.
  // On conserve la cotisation la PLUS ÉLEVÉE (= capital décès le plus protecteur) et on rembourse les plus petites.
  const grp = {};
  DB.adherents.forEach(a=>{ const c=R.cot(a,ex); if(!c||!(c.paye>0)) return;
    const cle = cleNom((a.nom||'')+' '+(a.prenom||''));
    (grp[cle]=grp[cle]||[]).push({id:a.id, mufid:a.mufid, compte:a.compte, matricule:a.matricule,
      categorie:a.categorie, fonction:a.fonction, paye:c.paye, capital:R.capital(a)}); });
  return Object.entries(grp)
    .filter(([,v])=> v.length>1)                         // plus d'une cotisation = cas à traiter (même MUFID incluse)
    .map(([cle,v])=>{ const details=v.sort((x,y)=>y.paye-x.paye || y.capital-x.capital);  // la plus élevée d'abord
      const payeTotal=v.reduce((s,x)=>s+x.paye,0);
      const aConserver=details[0].paye;                  // on garde la plus grande cotisation
      return {cle, cotisations:v.length, mufids:new Set(v.map(x=>x.mufid)).size, payeTotal,
        aConserver, aRembourser: payeTotal - aConserver, capitalConserve: details[0].capital, details}; })
    .sort((a,b)=> b.aRembourser-a.aRembourser || b.cotisations-a.cotisations);
}

let FEUILLES_IGNOREES = [];
function lireTableur(file){ return new Promise((res,rej)=>{ const r=new FileReader();
  r.onload = e=>{ try{ const wb = XLSX.read(new Uint8Array(e.target.result),{type:'array',cellDates:true});
      const ws = wb.Sheets[wb.SheetNames[0]];
      FEUILLES_IGNOREES = wb.SheetNames.slice(1).filter(n=>{ const w=wb.Sheets[n]; return w && w['!ref']; });
      // Un nombre long (matricule, compte, téléphone) est affiché par Excel en notation abrégée
      // (3.701E+11) : plusieurs membres deviendraient identiques. On restitue tous les chiffres.
      Object.keys(ws).forEach(k=>{ const c=ws[k]; if(k[0]!=='!' && c && c.t==='n' && Number.isInteger(c.v) && /e[+-]/i.test(String(c.w||''))) c.w=String(c.v); });
      res(XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:''})); }catch(x){ rej(x); } };
  r.onerror = rej; r.readAsArrayBuffer(file); }); }
function lireWord(file){ return new Promise((res,rej)=>{ const r=new FileReader();
  r.onload = e=>{ mammoth.convertToHtml({arrayBuffer:e.target.result}).then(o=>{
      const doc = new DOMParser().parseFromString(o.value,'text/html');
      const t = doc.querySelector('table');
      if(t){ res(Array.from(t.querySelectorAll('tr')).map(tr=>Array.from(tr.querySelectorAll('td,th')).map(td=>td.textContent.trim()))); return; }
      const lignes = doc.body.textContent.split('\n').map(x=>x.trim()).filter(Boolean)
        .map(x=>x.split(/\t|\s{2,}|;|\|/).map(c=>c.trim()).filter(c=>c!==''));
      res(lignes.filter(l=>l.length>1));
    }).catch(rej); };
  r.onerror = rej; r.readAsArrayBuffer(file); }); }
async function lirePdf(file){
  if(window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data:buf}).promise;
  const out = [];
  for(let p=1;p<=pdf.numPages;p++){
    const page = await pdf.getPage(p), tc = await page.getTextContent();
    const par = {};
    tc.items.forEach(it=>{ const y = Math.round(it.transform[5]);
      let cle = Object.keys(par).find(k=>Math.abs(k-y)<=3) || y; (par[cle]=par[cle]||[]).push({x:it.transform[4],s:it.str}); });
    Object.keys(par).sort((a,b)=>b-a).forEach(y=>{
      const items = par[y].sort((a,b)=>a.x-b.x), cells=[]; let cur='', lastX=null;
      items.forEach(i=>{ if(lastX!==null && i.x-lastX > 14){ cells.push(cur.trim()); cur=''; } cur += i.s; lastX = i.x + i.s.length*4.6; });
      if(cur.trim()) cells.push(cur.trim());
      if(cells.filter(Boolean).length>1) out.push(cells);
    });
  }
  return out;
}
/* Repère la ligne d'en-tête réelle (ignore titre du document, lignes vides, sous-titres).
   On note chaque ligne des 10 premières : +points si une cellule correspond à un indicateur connu. */
function trouverEntete(lignes){
  const tousInd = CHAMPS.flatMap(c=>c.ind);
  let best=0, bestScore=-1;
  const lim = Math.min(10, lignes.length);
  for(let i=0;i<lim;i++){
    const cells = lignes[i].map(x=>norm(x));
    const remplies = cells.filter(x=>x!=='').length;
    if(remplies<2) continue;                       // trop peu de colonnes : pas un en-tête
    let hits=0;
    cells.forEach(n=>{ if(n && tousInd.some(x=> n===x || (x.length>=4 && (n.includes(x)||x.includes(n))))) hits++; });
    // bonus si beaucoup de colonnes remplies et courtes (intitulés), malus si cellules longues (données/titre)
    const longMoy = cells.filter(x=>x).reduce((s,x)=>s+x.length,0)/Math.max(1,remplies);
    const score = hits*3 + remplies - (longMoy>25?3:0);
    if(score>bestScore){ bestScore=score; best=i; }
    if(hits>=3) { return i; }                       // en-tête évident trouvé
  }
  return best;
}
function autoMapper(){
  IMP.map = {};
  const pris = new Set();
  // 1er passage : égalité exacte (prioritaire — évite que "MUFID" soit pris par l'indicateur "id")
  IMP.entete.forEach((h,i)=>{ const n = norm(h); if(!n) return;
    const c = CHAMPS.find(c=> !pris.has(c.k) && c.ind.some(x=> n===x));
    if(c && IMP.map[c.k]===undefined){ IMP.map[c.k]=i; pris.add(c.k); }
  });
  // 2e passage : inclusion, mais seulement pour les indicateurs d'au moins 4 lettres (pas "id", "cat"…)
  IMP.entete.forEach((h,i)=>{ const n = norm(h); if(!n || Object.values(IMP.map).includes(i)) return;
    const c = CHAMPS.find(c=> !pris.has(c.k) && c.ind.some(x=> x.length>=4 && (n.includes(x)||x.includes(n))));
    if(c && IMP.map[c.k]===undefined){ IMP.map[c.k]=i; pris.add(c.k); }
  });
}

function valeurLigne(r, k){ const i = IMP.map[k]; return i==null? '' : String(r[i]==null?'':r[i]).trim(); }
function versDate(v){
  if(!v) return null;
  if(v instanceof Date && !isNaN(v)) return v.toISOString().slice(0,10);
  const s = String(v).trim();
  let m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
  if(m){ let an=+m[3]; if(an<100) an += an>40?1900:2000; return `${an}-${String(+m[2]).padStart(2,'0')}-${String(+m[1]).padStart(2,'0')}`; }
  m = s.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/);
  if(m) return `${m[1]}-${String(+m[2]).padStart(2,'0')}-${String(+m[3]).padStart(2,'0')}`;
  if(/^\d{5}$/.test(s)){ const d = new Date(Date.UTC(1899,11,30)+ (+s)*86400000); return d.toISOString().slice(0,10); }
  const d = new Date(s); return isNaN(d)? null : d.toISOString().slice(0,10);
}
function versNombre(v){
  if(v==null||v==='') return 0;
  if(typeof v==='number') return isNaN(v)?0:v;
  let s = String(v).trim().replace(/[^\d,.\-\s]/g,'').replace(/\s/g,''); // garde chiffres, séparateurs, signe
  if(!s) return 0;
  const virg = s.lastIndexOf(','), pt = s.lastIndexOf('.');
  // Le dernier séparateur n'est "décimal" que s'il reste 1 ou 2 chiffres après lui ; sinon c'est un séparateur de milliers.
  const sep = Math.max(virg, pt);
  if(sep >= 0){
    const apres = s.length - sep - 1;
    if(apres >= 1 && apres <= 2 && (s.match(/[.,]/g)||[]).length === 1 && !/[.,]\d{3}$/.test(s)){
      // un seul séparateur, 1-2 chiffres après : décimal réel (ex. 2500,5 / 2500.50)
      s = s.slice(0,sep).replace(/[.,]/g,'') + '.' + s.slice(sep+1);
    } else {
      // séparateur(s) de milliers : on les retire tous (ex. 10.000 / 10 000 / 1.000.000)
      s = s.replace(/[.,]/g,'');
    }
  }
  const n = parseFloat(s); return isNaN(n)?0:n;
}
function versBool(v){ return /^(1|oui|yes|vrai|true|x|o)$/i.test(String(v||'').trim()); }
function devineFonction(txt, cat){
  const n = norm(txt);
  if(cat===3) return 'mutualiste';
  if(!n) return 'personnel';
  // Dirigeants supérieurs (tester AVANT le président, car "vice-président" contient "président")
  if(/vice.?president|president.*conseil.*surveillance|president.*conseil.*honoraire|president.*cs\b|president.*ch\b|directeur general|directeur gen|\bdga\b|\bdg\b/.test(n)) return 'dirigeant';
  // Président du Conseil d'Administration (capital le plus élevé) — sans "vice"
  if(/president.*conseil.*administration|\bpca\b|\bpresident du ca\b|^president$/.test(n)) return 'pca';
  // Élus et membres des conseils (administrateur, CS, honoraire…) — NE DOIVENT PAS devenir "personnel"
  if(/administrateur|membre.*conseil|conseil.*surveillance|conseil.*administration|conseil.*honoraire|surveillance|honoraire|\belu\b|\belus\b|censeur|commissaire|directeur mufid|directeur de/.test(n)) return 'elu';
  // Personnel salarié
  if(/agent|caissier|comptable|salarie|personnel|employe|guichet|\bchef\b|secretaire|cadre|gestionnaire|charge de/.test(n)) return 'personnel';
  return 'personnel';
}
/* Lecture souple de la catégorie : accepte 1/2/3, "Cat 1", "C1", "catégorie 2", "institutionnel", "mutualiste"… */
function lireCategorie(v){
  const n = norm(v); if(!n) return 0;
  let m = n.match(/\b([123])\b/) || n.match(/\b(?:c|cat|categorie|classe)\s*0*([123])\b/);
  if(m) return +m[1];
  if(/mutualiste|physique|morale|coop/.test(n)) return 3;
  if(/retrait/.test(n)) return 2;
  if(/actif|institutionnel|elu|personnel|salarie/.test(n)) return 1;

/* Retrouve ou crée une MUFID à partir du libellé du fichier, en conservant le NOM LITTÉRAL.
   Le code court (interne) est dérivé proprement, le nom affiché reste complet (ex. « Bandenkop »). */
function resoudreMufid(libelle){
  const lib = String(libelle||'').trim(); if(!lib) return '';
  const n = norm(lib);
  // déjà connue ? (par nom ou par code)
  const sansPrefixe = x => x.replace(/^mufid\s+/,'');
  const ex = DB.mufids.find(m => norm(m.nom)===n || norm(m.code)===n || sansPrefixe(norm(m.nom))===sansPrefixe(n) || norm(m.code)===sansPrefixe(n));
  if(ex) return ex.code;
  // nouveau code court lisible, nom = libellé complet mis en forme
  let code = lib.replace(/^mufid\s+/i,'').trim().slice(0,10).toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(!code) code = 'MUF'+(DB.mufids.length+1);
  let base=code, i=2; while(DB.mufids.find(m=>m.code===code)){ code=base+i; i++; }
  const nomPropre = /^mufid/i.test(lib)? lib : 'MUFID '+lib.charAt(0).toUpperCase()+lib.slice(1).toLowerCase();
  DB.mufids.push({code, nom:nomPropre});
  return code;
}

  return max;
}

    const idStable = cleAdherent({matricule:mat, mufid, nom, prenom, compte:valeurLigne(r,'compte'), telephone:valeurLigne(r,'telephone'), cni:valeurLigne(r,'cni')});
    if(!mat && IMP.matServeur && IMP.matServeur[idStable]) mat = IMP.matServeur[idStable];   // membre déjà en base : il garde son matricule
    if(!mat){ const code = mufid || 'MUF'; matSeq[code] = (matSeq[code]|| compteurDepart(code)) + 1; mat = code+'-'+String(matSeq[code]).padStart(4,'0'); }
    const a = {
      id: idStable,
      matricule: mat,
      nom, prenom, raisonSociale: raison, typePersonne: type,
      personneCouverte: valeurLigne(r,'personneCouverte') || (type==='morale'? '' : ''),
      formeMorale: /societ|entrepr|sarl|sa\b|etablis/i.test(raison)? 'societe':'association',
      dateNaissance: versDate(valeurLigne(r,'dateNaissance')),
      sexe: valeurLigne(r,'sexe'), cni: valeurLigne(r,'cni'), telephone: valeurLigne(r,'telephone'),
      compte: valeurLigne(r,'compte'), mufid, categorie: cat,
      fonction: fonc,
      qualite: valeurLigne(r,'qualite') || valeurLigne(r,'fonction') || '',
      dateAdhesion: versDate(valeurLigne(r,'dateAdhesion')) || dAdh,
      anneesService: versNombre(valeurLigne(r,'anneesService')),
      solde: versNombre(valeurLigne(r,'solde')), mouvements: versNombre(valeurLigne(r,'mouvements')),
      option: versBool(valeurLigne(r,'option')), ancienMembre: IMP.map.ancienMembre!=null? versBool(valeurLigne(r,'ancienMembre')) : dAncien,
      statut:'actif', ayantsDroit:[], cot:{}, ligne: idx+2

    const cp = versNombre(valeurLigne(r,'cotisationPayee'));
    if(cp>0) a.cot[DB.params.exercice] = {du:R.cotisationDue(a), paye:cp, date:auj(), mode:'Reprise de fichier', payeur:null};
    a.erreurs = []; a.avis = [];
    if(!a.nom && !a.raisonSociale) a.erreurs.push('Nom ou raison sociale manquant');
    if(!a.mufid) a.avis.push('MUFID non renseignée');
    if(!a.dateNaissance && a.typePersonne==='physique') a.avis.push('Date de naissance absente : période d’attente calculée sur 12 mois');
    if(a.typePersonne==='morale' && !a.personneCouverte) a.avis.push('Tête assurée à désigner (art. 18)');
    if(!R.eligible(a)) a.avis.push('Non éligible : 60 ans ou plus à l’adhésion (art. 12.1)');
    if(a.categorie===2 && a.anneesService < DB.params.anneesServiceMinCat2) a.avis.push('Moins de '+DB.params.anneesServiceMinCat2+' ans de service');

  });

  // On garde la dernière occurrence (la plus à jour) et on signale les lignes éliminées.

  const uniques = lignes.filter(a=> a.erreurs.length || parId[a.id]===a);
  uniques.forEach(a=>{ if(compte[a.id]>1){ a.avis.push(compte[a.id]+' lignes identiques dans le fichier — fusionnées en une'); } });
  uniques._elimines = elimines;
  return uniques;
}

function construireImportComite(){

function construireImportMufid(){

  });

          <td>${a.categorie===3?'<span class="disc">Mutualiste</span>':`<select data-fonc="${i}" style="padding:2px 4px">${Object.entries(FONCTIONS).filter(([k])=>k!=='mutualiste').map(([k,fo])=>`<option value="${k}" ${a.fonction===k?'selected':''}>${fo.lib.length>34?fo.lib.slice(0,34)+'…':fo.lib}</option>`).join('')}</select>`}</td>
          <td>${esc(R.mufidNom(a.mufid))}</td>
          <td class="n" data-cap="${i}">${fcfa(R.capital(a))}</td><td class="n">${fcfa(R.cotisationDue(a))}</td>
          <td>${a.erreurs.length?'<span class="et ko">Rejetée</span>':a.existant?'<span class="et inf">Mise à jour</span>':'<span class="et ok">Création</span>'}</td>
          <td class="disc">${esc(a.erreurs.concat(a.avis).join(' · '))}</td></tr>`).join('')}
      </tbody></table></div>
      ${l.length>250?`<div class="disc" style="padding:8px 0">Aperçu limité à 250 lignes (modifiables) ; l'import portera sur les ${nb(l.length)} lignes.</div>`:''}
      <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn" id="impGo">Importer ${nb(valides)} adhérent(s)</button>
        <button class="btn s" id="impAnnule">Annuler</button>
      </div>
    </div></div>`;
  // édition en direct de la catégorie et de la fonction
  $$('#impVerif [data-cat]').forEach(sel=>sel.onchange=()=>{ const i=+sel.dataset.cat; l[i].categorie=+sel.value;
    if(l[i].categorie===3) l[i].fonction='mutualiste'; else if(l[i].fonction==='mutualiste') l[i].fonction='personnel';
    const cap=$('#impVerif [data-cap="'+i+'"]'); if(cap) cap.textContent=fcfa(R.capital(l[i]));
    const fs=$('#impVerif [data-fonc="'+i+'"]'); // relancer pour afficher/masquer le sélecteur de fonction
    verifierImportDepuis(l); });
  $$('#impVerif [data-fonc]').forEach(sel=>sel.onchange=()=>{ const i=+sel.dataset.fonc; l[i].fonction=sel.value;
    const cap=$('#impVerif [data-cap="'+i+'"]'); if(cap) cap.textContent=fcfa(R.capital(l[i])); });
  $('#impAnnule').onclick = ()=>{ IMP=null; rendImport(); };
  if($('#dSync')) $('#dSync').onchange=()=>{ const ai=$('#dSyncAide'); if(ai) ai.style.display=$('#dSync').checked?'block':'none'; };
  $('#impGo').onclick = async ()=>{
    const valides = l.filter(a=>!a.erreurs.length).map(a=>{ const b=Object.assign({},a); delete b.erreurs; delete b.avis; delete b.ligne; delete b.existant; delete b._doublonInterne; return b; });
    if(!valides.length){ toast('Aucune ligne valide à importer','ko'); return; }
    const sync = $('#dSync') && $('#dSync').checked;
    // MUFID concernée(s) par le fichier (pour la synchronisation)
    const mufidsFichier = [...new Set(valides.map(a=>a.mufid).filter(Boolean))];

    if(Srv.actif()){
      $('#impGo').disabled = true;
      $('#impVerif').insertAdjacentHTML('beforeend', `<div class="bloc" id="impProg"><div class="corps">
        <div class="disc" id="impProgTxt">Transmission au serveur…</div>
        <div class="rail" style="height:9px;background:var(--papier);border-radius:5px;margin-top:8px;overflow:hidden"><div id="impProgBar" style="height:9px;width:0;background:var(--vert);transition:width .2s"></div></div></div></div>`);
      const prog=(fait,tot,lib)=>{ const p=Math.round(fait/Math.max(1,tot)*100); const b=document.getElementById('impProgBar'),t=document.getElementById('impProgTxt');
        if(b) b.style.width=p+'%'; if(t) t.textContent=`${lib||''} ${nb(fait)} / ${nb(tot)} (${p} %)`; };
      try{
        await Cloud.pushMeta(DB);
        // 1) Synchronisation : calculer les absents AVANT d'écrire (sans rien supprimer encore)
        let aRetirer=[];
        if(sync){
          const idsFichier=new Set(valides.map(a=>a.id));
          for(const code of mufidsFichier){
            const idsBase=await Srv.idsMufid(code);
            idsBase.forEach(id=>{ if(!idsFichier.has(id)) aRetirer.push(id); });
          }
        }
        // 2) Écrire le fichier (upsert : met à jour + ajoute) — la base n'est jamais vide
        await Srv.upsertLot(valides, (fait,tot)=>prog(fait,tot,'Intégration'));
        // 3) Retirer les absents seulement après un upsert réussi
        if(sync && aRetirer.length) await Srv.supprimerLot(aRetirer,(fait,tot)=>prog(fait,tot,'Retrait des absents'));
        // Bilan RÉEL : on recompte en base au lieu d'annoncer le nombre de lignes envoyées
        let avant=0, apres=0;
        for(const code of mufidsFichier){ avant += (IMP.avantServeur&&IMP.avantServeur[code])||0; apres += await Srv.compterMufid(code); }
        const nouveaux = Math.max(0, apres - avant + (sync?aRetirer.length:0));
        const majs = Math.max(0, valides.length - nouveaux);
        const nomFic = IMP.nom, lus = IMP.corps.length, fusion = l._elimines||0, rejet = l.filter(a=>a.erreurs.length).length;
        journal('Import de membres (serveur)', `${nomFic} — ${lus} lignes lues, ${nouveaux} créé(s), ${majs} mis à jour${sync?`, ${aRetirer.length} retiré(s)`:''} — total en base ${apres}`);
        await Cloud.auditer('Import MUFID', `${nomFic} — ${nouveaux} créés, ${majs} mis à jour${sync?`, ${aRetirer.length} retirés`:''}, total ${apres}`);
        IMP=null; await rafraichir(); aller('adherents');
        modale('Bilan de l’import', `<div class="note ${majs||fusion||rejet?'ambre':'vert'}"><b>${esc(nomFic)}</b>
          ${nb(lus)} ligne(s) lue(s) · <b>${nb(nouveaux)} nouveau(x) adhérent(s)</b> · ${nb(majs)} mis à jour (déjà en base)
          ${fusion?` · ${nb(fusion)} ligne(s) fusionnée(s) (identiques dans le fichier)`:''}${rejet?` · ${nb(rejet)} rejetée(s)`:''}${sync&&aRetirer.length?` · ${nb(aRetirer.length)} retiré(s)`:''}</div>
          <div class="note"><b>Total en base pour ${mufidsFichier.map(c=>esc(R.mufidNom(c))).join(', ')} : ${nb(avant)} → ${nb(apres)} adhérent(s)</b>
          ${majs&&!nouveaux?'Aucun membre ajouté : toutes les lignes correspondaient à des membres déjà présents.':''}</div>`, [{t:'Fermer'}]);
      }catch(e){ toast('Échec de l’import serveur : '+(e.message||e),'ko'); $('#impGo').disabled=false; }
      return;
    }
    // Mode local
    let c=0,m=0; const idx={}; DB.adherents.forEach(a=>idx[a.id]=a);
    const idsFichier=new Set(valides.map(a=>a.id));
    valides.forEach(a=>{ if(idx[a.id]){ const cot=idx[a.id].cot||{}; Object.assign(idx[a.id], a, {cot:Object.assign({},cot,a.cot)}); m++; }
      else { idx[a.id]=a; DB.adherents.push(a); c++; } });
    let retires=0;
    if(sync){ const avant=DB.adherents.length;
      DB.adherents=DB.adherents.filter(a=> !mufidsFichier.includes(a.mufid) || idsFichier.has(a.id));
      retires=avant-DB.adherents.length; }
    journal('Import de membres', `${IMP.nom} — ${c} création(s), ${m} mise(s) à jour${sync?`, ${retires} retiré(s)`:''}`);
    sauver(true); toast(`${c} créé(s), ${m} mis à jour${sync?` · ${retires} retiré(s)`:''}`,'ok'); IMP=null; aller('adherents');
  };
}

function feuille(wb, nom, lignes){ const ws = XLSX.utils.aoa_to_sheet(lignes);
  ws['!cols'] = (lignes[0]||[]).map((_,i)=>({wch: Math.min(38, Math.max(10, ...lignes.slice(0,80).map(r=>String(r[i]==null?'':r[i]).length+2)))}));
  // Colonnes de montants : format « nombre à séparateur de milliers » (les valeurs restent additionnables)
  const entete = lignes[0]||[];
  const estMontant = h => /capital|cotisation|cotise|part |montant|appel|encaiss|pay|reste|solde|indemnit|engagement|provision|r[ée]serve/i.test(String(h||''));
  const estTaux = h => /taux|ratio|recouvrement|pourcent/i.test(String(h||''));
  const colM = entete.map((h,i)=> estMontant(h)&&!estTaux(h) ? i : -1).filter(i=>i>=0);
  const colT = entete.map((h,i)=> estTaux(h) ? i : -1).filter(i=>i>=0);
  if(colM.length || colT.length){
    const R0 = XLSX.utils.decode_range(ws['!ref']);
    for(let r=1; r<=R0.e.r; r++){
      colM.forEach(ci=>{ const ad=XLSX.utils.encode_cell({r,c:ci}); const cell=ws[ad]; if(cell && typeof cell.v==='number'){ cell.t='n'; cell.z='# ##0'; } });
      colT.forEach(ci=>{ const ad=XLSX.utils.encode_cell({r,c:ci}); const cell=ws[ad]; if(cell && typeof cell.v==='number'){ cell.t='n'; cell.z=(Math.abs(cell.v)<=1?'0.0%':'0.0'); } });
    }
  }
  XLSX.utils.book_append_sheet(wb, ws, nom.slice(0,31)); }
function classeur(nom, feuilles){ const wb = XLSX.utils.book_new(); feuilles.forEach(f=>feuille(wb,f[0],f[1]));
  XLSX.writeFile(wb, nom); toast('Fichier Excel généré','ok'); }

/* =====================================================================
   CARTE DE MEMBRE FAS-MUFID (1.26) — format carte bancaire 85,6 x 54 mm, code-barres Code 128
   ===================================================================== */
const C128 = '11011001100,11001101100,11001100110,10010011000,10010001100,10001001100,10011001000,10011000100,10001100100,11001001000,11001000100,11000100100,10110011100,10011011100,10011001110,10111001100,10011101100,10011100110,11001110010,11001011100,11001001110,11011100100,11001110100,11101101110,11101001100,11100101100,11100100110,11101100100,11100110100,11100110010,11011011000,11011000110,11000110110,10100011000,10001011000,10001000110,10110001000,10001101000,10001100010,11010001000,11000101000,11000100010,10110111000,10110001110,10001101110,10111011000,10111000110,10001110110,11101110110,11010001110,11000101110,11011101000,11011100010,11011101110,11101011000,11101000110,11100010110,11101101000,11101100010,11100011010,11101111010,11001000010,11110001010,10100110000,10100001100,10010110000,10010000110,10000101100,10000100110,10110010000,10110000100,10011010000,10011000010,10000110100,10000110010,11000010010,11001010000,11110111010,11000010100,10001111010,10100111100,10010111100,10010011110,10111100100,10011110100,10011110010,11110100100,11110010100,11110010010,11011011110,11011110110,11110110110,10101111000,10100011110,10001011110,10111101000,10111100010,11110101000,11110100010,10111011110,10111101110,11101011110,11110101110,11010000100,11010010000,11010011100'.split(','), C128_STOP = '1100011101011';
function code128B(txt){
  const t = String(txt||'').replace(/[^\x20-\x7E]/g,'?');
  const vals = [104]; for(const ch of t) vals.push(ch.charCodeAt(0)-32);
  let sum = 104; for(let i=1;i<vals.length;i++) sum += vals[i]*i;
  vals.push(sum % 103);
  return vals.map(v=>C128[v]).join('') + C128_STOP;      // suite de modules : 1 = barre, 0 = espace
}
function dessinerCodeBarre(doc, txt, x, y, w, h){
  const m = code128B(txt), mod = w / m.length;
  doc.setFillColor(0,0,0);
  let i=0; while(i<m.length){ if(m[i]==='1'){ let j=i; while(j<m.length && m[j]==='1') j++; doc.rect(x+i*mod, y, (j-i)*mod, h, 'F'); i=j; } else i++; }
}
/* Période de couverture affichée sur la carte (art. 13 et paramètres de l'exercice) :
   début = fin de la période d'attente (immédiate pour les catégories 1 et 2 et les anciens membres),
   au plus tôt le 1er janvier de l'exercice ;
   fin = fin de couverture de l'exercice (cotisation 2026 : jusqu'au 31/12/2027). */
function couvertureCarte(a){
  const P=DB.params||{}, ex=+P.exercice;
  // la couverture ne peut commencer avant l'exercice couvert (le Fonds démarre en 2026)
  const fc = R.finCarence(a), d0 = ex ? ex+'-01-01' : null;
  const debut = (fc && d0) ? (fc > d0 ? fc : d0) : (fc || d0);
  const fin = (ex===2026 && P.finCouverture2026) ? P.finCouverture2026 : (ex? ex+'-12-31' : null);
  // période d'attente (art. 13) : affichée seulement si elle court pendant l'exercice couvert
  const mois = R.moisCarence(a), dep = a.dateReadhesion || a.dateAdhesion;
  let attente = null;
  if(mois>0 && dep && fc && d0 && fc > d0){
    const veille = new Date(fc); veille.setDate(veille.getDate()-1);
    attente = {mois, du: iso(dep), au: veille.toISOString().slice(0,10)};
  }
  return {debut, fin, attente};
}
/* Année d'adhésion au Fonds : le FAS-MUFID démarre en 2026 ; une adhésion à la MUFID antérieure
   ne fait pas remonter l'adhésion au Fonds. */
function anneeMembreFonds(a){
  const lancement = new Date((DB.params||{}).finLancement || '2026-12-31').getFullYear() || 2026;
  const adh = a.dateAdhesion ? new Date(a.dateAdhesion).getFullYear() : NaN;
  return String(isNaN(adh) ? lancement : Math.max(adh, lancement));
}

/* Lot de cartes : 1 000 au maximum par fichier. Mesuré : 1 000 cartes = environ 11 Mo de PDF ;
   c'est aussi la taille maximale d'une page de résultats du serveur (une seule requête par lot). */
const LOT_MAX = 1000;
function sortieDoc(doc, nom, mode){
  if(mode==='imprimer'){
    doc.autoPrint();
    const url = URL.createObjectURL(doc.output('blob'));
    const w = window.open(url, '_blank');
    if(!w) modale('Impression', `<div class="note">Le document est prêt, mais votre navigateur a bloqué la fenêtre d’impression.</div>
      <a class="btn" href="${url}" target="_blank" rel="noopener">Ouvrir le document pour l’imprimer</a>`, [{t:'Fermer'}]);
    else toast('Document ouvert pour impression','ok');
    return;
  }
  sortiePdf(doc, nom);
}
async function lotCartes(liste, nom, mode){
  const ok = liste.filter(a=>!['RADIE','DECEDE'].includes(R.statut(a).c));
  const exclus = liste.length-ok.length;
  if(!ok.length){ toast('Aucune carte à éditer'+(exclus?' (membres radiés ou décédés exclus)':''),'ko'); return; }
  if(ok.length>LOT_MAX){ toast('Maximum '+nb(LOT_MAX)+' cartes par lot','ko'); return; }
  toast('Préparation de '+nb(ok.length)+' carte(s)…');
  await new Promise(r=>setTimeout(r,30));
  const { jsPDF } = window.jspdf; const doc = new jsPDF({unit:'mm', format:'a4'});
  ok.forEach((a,i)=>{ if(i) doc.addPage(); dessinerCarteA4(doc, a); });
  try{ if(Cloud.session) Cloud.auditer('Lot de cartes', nom+' — '+ok.length+' carte(s)'); }catch(e){}
  if(exclus) toast(exclus+' membre(s) radié(s) ou décédé(s) exclu(s) du lot');
  sortieDoc(doc, nom, mode);
}
/* Carte A4 d'un membre : téléchargement PDF ou impression directe. */
function sortieCarte(a, mode){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'mm', format:'a4'}); dessinerCarteA4(doc, a);
  const nom = `FAS-MUFID_carte_${String(a.matricule||a.id).replace(/[^A-Za-z0-9_-]/g,'_')}.pdf`;
  if(mode==='imprimer'){
    doc.autoPrint();
    const url = URL.createObjectURL(doc.output('blob'));
    const w = window.open(url, '_blank');
    if(!w) modale('Impression', `<div class="note">Votre navigateur a bloqué la fenêtre d’impression.</div>
      <a class="btn" href="${url}" target="_blank" rel="noopener">Ouvrir la carte pour l’imprimer</a>`, [{t:'Fermer'}]);
    else toast('Carte ouverte pour impression','ok');
    try{ if(Cloud.session) Cloud.auditer('Carte imprimée', a.matricule||a.id); }catch(e){}
    return;
  }
  doc.save(nom); toast('Carte téléchargée : '+nom,'ok');
  try{ if(Cloud.session) Cloud.auditer('Carte téléchargée', a.matricule||a.id); }catch(e){}
}
/* Sélecteur de membre avec recherche (serveur ou local), limité à une MUFID. */
async function chercherMembres(code, q){
  if(Srv.actif()){ const r = await Srv.page({q, mufid:code, page:0, taille:30, tri:'nom', sens:1}); return r.rows; }
  const n=norm(q||'');
  return (DB.adherents||[]).filter(a=>a.mufid===code && (!n || norm(R.nomComplet(a)+' '+(a.matricule||'')).includes(n)))
    .sort((a,b)=>String(R.nomComplet(a)).localeCompare(String(R.nomComplet(b)),'fr')).slice(0,30);
}

/* Signature du DG de MUFID Union : administrateur seul (enregistrer, remplacer, supprimer). */
function gererSignatureDG(){
  if(!AC.estAdmin()){ toast('Réservé à l’administrateur','ko'); return; }
  const P=DB.params;
  modale('Signature du DG de MUFID Union', `
    <div class="note">Cette signature et ce nom sont imprimés sur toutes les cartes de membre. Ils s’enregistrent une seule fois.</div>
    <div class="champ"><label>Nom du Directeur Général de MUFID Union</label><input type="text" id="sdN" value="${esc(P.nomDG||'')}"></div>
    <div style="height:90px;display:flex;align-items:center;justify-content:center;border:1px dashed var(--ligne);border-radius:6px;background:#fff;margin:8px 0">
      ${P.signatureDG?`<img src="${P.signatureDG}" style="max-height:80px;max-width:90%">`:'<span class="disc">Aucune signature enregistrée</span>'}</div>
    <input type="file" id="sdF" accept="image/*,application/pdf,.pdf" style="display:none">`,
    [{t:'Fermer'},
     ...(P.signatureDG?[{t:'Supprimer la signature', cl:'d', f:()=>{ if(!confirm('Supprimer la signature du DG ? Les cartes seront éditées sans signature.')) return false;
        delete DB.params.signatureDG; sauver(true).then(()=>{ toast('Signature supprimée','ok'); gererSignatureDG(); }); return false; }}]:[]),
     {t:P.signatureDG?'Remplacer la signature':'Importer la signature', cl:'s', f:()=>{ const f=$('#sdF');
        f.onchange=async ()=>{ const fi=f.files[0]; f.value=''; if(!fi) return;
          try{ DB.params.signatureDG = canvasVersSignature(rognerSurTrace(await fichierVersCanvas(fi)));
            const n=$('#sdN'); if(n) DB.params.nomDG=n.value.trim();
            await sauver(true); toast('Signature du DG enregistrée','ok'); gererSignatureDG(); }
          catch(e){ toast('Échec : '+(e.message||e),'ko'); } };
        f.click(); return false; }},
     {t:'Enregistrer le nom', cl:'', f:()=>{ DB.params.nomDG=$('#sdN').value.trim(); sauver(true).then(()=>toast('Nom du DG enregistré','ok')); return false; }}]);
}
async function adherentsDeLaMufid(code){
  if(Srv.actif()) return await Srv.tousAdherents(null, {mufid:code});
  return (DB.adherents||[]).filter(a=>a.mufid===code).sort((a,b)=>String(R.nomComplet(a)).localeCompare(String(R.nomComplet(b)),'fr'));
}
/* Signature du DG de MUFID Union : image ou PDF, rognée automatiquement sur le tracé. */
function rognerSurTrace(cv){
  const c=cv.getContext('2d'), d=c.getImageData(0,0,cv.width,cv.height).data;
  let x1=cv.width, y1=cv.height, x2=-1, y2=-1;
  for(let yy=0; yy<cv.height; yy+=2) for(let xx=0; xx<cv.width; xx+=2){ const p=(yy*cv.width+xx)*4;
    if(d[p+3]>40 && (d[p]+d[p+1]+d[p+2]) < 560){ if(xx<x1)x1=xx; if(xx>x2)x2=xx; if(yy<y1)y1=yy; if(yy>y2)y2=yy; } }
  if(x2<0) return cv;
  const m=8; x1=Math.max(0,x1-m); y1=Math.max(0,y1-m); x2=Math.min(cv.width-1,x2+m); y2=Math.min(cv.height-1,y2+m);
  const o=document.createElement('canvas'); o.width=x2-x1+1; o.height=y2-y1+1; o.getContext('2d').drawImage(cv,x1,y1,o.width,o.height,0,0,o.width,o.height); return o;
}

  el.innerHTML=`<div class="bloc"><div class="corps">Chargement…</div></div>`;
  let V=null; try{ V=await ventilationCategories(); }catch(e){}
  const m=(V&&V.mufids||[]).find(x=>memeMufid(x.code,code)) || {n:{1:0,2:0,3:0}};
  const tot=m.n[1]+m.n[2]+m.n[3];
  let r={rows:[],total:0};

      <div class="disc">Exercice ${esc(String(DB.params.exercice))} · ${nb(tot)} membre(s) — catégorie 1 : ${nb(m.n[1])} · catégorie 2 : ${nb(m.n[2])} · catégorie 3 : ${nb(m.n[3])}</div></div></div>
    <div class="bloc"><h2>Carte de membre</h2><div class="corps" id="mmCarte"></div></div>
    <div class="bloc"><h2>Membres de ma MUFID</h2><div class="corps">
      <div class="champ"><label>Filtrer la liste (nom ou matricule)</label><input type="search" id="mmQ" value="${esc(MM.q)}"></div>
      <div style="overflow-x:auto"><table class="t"><thead><tr><th>Nom</th><th>Matricule</th><th>Catégorie</th><th>Statut</th></tr></thead><tbody>
      ${(r.rows||[]).map(a=>`<tr><td>${esc(R.nomComplet(a))}</td><td>${esc(a.matricule||'')}</td><td>${esc((CATEGORIES[a.categorie]||{}).court||'')}</td><td>${esc(R.statut(a).lib)}</td></tr>`).join('') || `<tr><td colspan="4"><div class="vide">Aucun membre trouvé</div></td></tr>`}
      </tbody></table></div>
      <div style="display:flex;gap:8px;align-items:center;margin-top:10px">
        <button class="btn s" id="mmPrec" ${MM.page<=0?'disabled':''}>‹ Précédent</button>
        <span class="disc">Page ${MM.page+1} / ${pages} · ${nb(r.total||0)} membre(s)</span>
        <button class="btn s" id="mmSuiv" ${MM.page>=pages-1?'disabled':''}>Suivant ›</button></div>
    </div></div>`;
  interfaceCarte($('#mmCarte'), code);
  const q=$('#mmQ'); let tm; q.oninput=()=>{ clearTimeout(tm); tm=setTimeout(()=>{ MM.q=q.value.trim(); MM.page=0; rendMaMufid(); }, 450); };
  $('#mmPrec').onclick=()=>{ MM.page--; rendMaMufid(); }; $('#mmSuiv').onclick=()=>{ MM.page++; rendMaMufid(); };
}

/* =====================================================================
   VENTILATION PAR MUFID ET PAR CATÉGORIE (états 1.20)
   Serveur : fonction SQL fas_mufid_categorie si installée, sinon lecture
   paginée des seules colonnes utiles. Local : calcul sur la base en mémoire.
   ===================================================================== */
async function ventilationCategories(){
  const ex = DB.params.exercice, acc = {};
  const ajoute = (mufid,cat,n,du,paye)=>{ const k=(mufid||'')+'|'+cat;
    const o = acc[k] || (acc[k]={mufid:mufid||'', cat:+cat, n:0, du:0, paye:0}); o.n+=n; o.du+=du; o.paye+=paye; };
  if(Srv.actif()){
    let ok=false;
    try{ const {data,error} = await Cloud.client.rpc('fas_mufid_categorie',{p_ex:ex}); if(error) throw error;
      (data||[]).forEach(r=>ajoute(r.mufid, r.categorie, +r.n||0, +r.du||0, +r.paye||0)); ok=true; }catch(e){ ok=false; }
    if(!ok){
      toast('Lecture de la base…');
      let from=0, total=0; const t=1000;
      do{ const {data,count,error} = await Cloud.client.from('fas_adherents').select('id,mufid,categorie,cot_du,cot_paye,statut',{count:'exact'})
            .neq('statut','RADIE').order('id').range(from,from+t-1);
        if(error) throw error; total=count||0;
        (data||[]).forEach(r=>ajoute(r.mufid, r.categorie, 1, r.statut==='DECEDE'?0:(+r.cot_du||0), +r.cot_paye||0));
        from+=t; } while(from<total);
    }
  } else {
    DB.adherents.forEach(a=>{ const st=R.statut(a).c; if(st==='RADIE') return;
      ajoute(a.mufid, a.categorie, 1, st==='DECEDE'?0:R.cotisationDue(a), (R.cot(a,ex)||{}).paye||0); });
  }
  const lignes = Object.values(acc);
  const cats = [1,2,3];
  const parMufid = {};
  lignes.forEach(l=>{ const m = parMufid[l.mufid] || (parMufid[l.mufid]={code:l.mufid, nom:R.mufidNom(l.mufid), n:{1:0,2:0,3:0}, du:{1:0,2:0,3:0}, paye:{1:0,2:0,3:0}});
    if(cats.includes(l.cat)){ m.n[l.cat]+=l.n; m.du[l.cat]+=l.du; m.paye[l.cat]+=l.paye; } });
  const mufids = Object.values(parMufid).sort((a,b)=>String(a.nom).localeCompare(String(b.nom),'fr'));
  const parCat = cats.map(c=>({cat:c, n:0, du:0, paye:0}));
  mufids.forEach(m=>cats.forEach((c,i)=>{ parCat[i].n+=m.n[c]; parCat[i].du+=m.du[c]; parCat[i].paye+=m.paye[c]; }));
  return {ex, mufids, parCat};
}
const somme = (arr,f)=>arr.reduce((s,x)=>s+(f(x)||0),0);
const xlTotal = (col,n1,n2,v)=>({t:'n', v, f:`SUM(${col}${n1}:${col}${n2})`});
const styleTotalPdf = n => ({didParseCell:d=>{ if(d.section==='body' && d.row.index===n-1){ d.cell.styles.fontStyle='bold'; d.cell.styles.fillColor=[232,240,247]; } }});

/* État 1 — MUFID par catégorie de membres */
async function exportMufidCategorieXls(){
  const V = await ventilationCategories(); if(!V.mufids.length){ toast('Aucun adhérent','ko'); return; }
  const L = V.mufids, n = L.length;
  const rows = [['MUFID','Code','Catégorie 1','Catégorie 2','Catégorie 3','Total']]
    .concat(L.map((m,i)=>[m.nom, m.code, m.n[1], m.n[2], m.n[3], {t:'n', v:m.n[1]+m.n[2]+m.n[3], f:`SUM(C${i+2}:E${i+2})`}]));
  rows.push(['TOTAL', n+' MUFID', ...['C','D','E','F'].map((c,k)=>xlTotal(c,2,n+1, k<3? somme(L,m=>m.n[k+1]) : somme(L,m=>m.n[1]+m.n[2]+m.n[3])))]);
  classeur(`FAS-MUFID_MUFID_par_categorie_${V.ex}.xlsx`, [['MUFID par catégorie', rows]]);
}
async function pdfMufidCategorie(){
  const V = await ventilationCategories(); if(!V.mufids.length){ toast('Aucun adhérent','ko'); return; }
  const L = V.mufids, tot = k => somme(L,m=>m.n[k]), T = tot(1)+tot(2)+tot(3);
  const doc = docPdf();
  let y = enteteDoc(doc, 'Effectifs des MUFID par catégorie de membres', `Exercice ${V.ex} — ${nb(L.length)} MUFID — ${nb(T)} adhérents (hors radiés)`);
  const corps = L.map(m=>[m.nom, nb(m.n[1]), nb(m.n[2]), nb(m.n[3]), nb(m.n[1]+m.n[2]+m.n[3])]);
  corps.push(['TOTAL', nb(tot(1)), nb(tot(2)), nb(tot(3)), nb(T)]);
  corps.push(['Part du total', pct(T?tot(1)/T:0), pct(T?tot(2)/T:0), pct(T?tot(3)/T:0), '100 %']);
  tablePdf(doc, ['MUFID','Catégorie 1','Catégorie 2','Catégorie 3','Total'], corps, y,
    Object.assign({columnStyles:{1:{halign:'right'},2:{halign:'right'},3:{halign:'right'},4:{halign:'right',fontStyle:'bold'}}}, styleTotalPdf(corps.length-1)));
  piedDoc(doc); sortiePdf(doc, `FAS-MUFID_MUFID_par_categorie_${V.ex}.pdf`);
}

  const r1 = [['Catégorie','Payeur','Membres','Cotisation appelée','Cotisation encaissée','Reste à recouvrer','Taux de recouvrement']]
    .concat(C.map((c,i)=>[CATEGORIES[c.cat].lib, CATEGORIES[c.cat].payeur, c.n, c.du, c.paye,
      {t:'n', v:c.du-c.paye, f:`D${i+2}-E${i+2}`}, {t:'n', v:c.du?c.paye/c.du:0, f:`IF(D${i+2}=0,0,E${i+2}/D${i+2})`}]));
  r1.push(['TOTAL','', xlTotal('C',2,4,somme(C,c=>c.n)), xlTotal('D',2,4,somme(C,c=>c.du)), xlTotal('E',2,4,somme(C,c=>c.paye)),
    xlTotal('F',2,4,somme(C,c=>c.du-c.paye)), {t:'n', v:somme(C,c=>c.du)?somme(C,c=>c.paye)/somme(C,c=>c.du):0, f:'IF(D5=0,0,E5/D5)'}]);
  const L = V.mufids, n = L.length;

/* =====================================================================
   EXPORTS PDF
   ===================================================================== */
function docPdf(orientation){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({orientation:orientation||'p', unit:'mm', format:'a4'});
  // Nettoyage automatique de TOUT texte écrit dans le PDF (espaces spéciales, apostrophes typo, tirets longs)
  const _text = doc.text.bind(doc);
  doc.text = function(t, x, y, o){
    if(typeof t==='string') t = txtPdf(t);
    else if(Array.isArray(t)) t = t.map(x=>typeof x==='string'?txtPdf(x):x);
    return _text(t, x, y, o);
  };
  return doc;
}
function enteteDoc(doc, titre, sous){
  doc.setFillColor(16,33,46); doc.rect(0,0,doc.internal.pageSize.getWidth(),24,'F');
  doc.setTextColor(255); doc.setFont('helvetica','bold'); doc.setFontSize(13);
  doc.text('MUFID UNION', 12, 10);
  doc.setFont('helvetica','normal'); doc.setFontSize(8);
  doc.text('Réseau des Mutuelles Financières de Développement — Agrément N° 00000296/MINFI du 22 avril 2020', 12, 15);
  doc.text('Fonds d’Assistance Sociale (FAS-MUFID) — Siège social : Yaoundé, Cameroun', 12, 19.5);
  doc.setTextColor(16,33,46); doc.setFont('helvetica','bold'); doc.setFontSize(13);
  doc.text(titre, 12, 34);
  if(sous){ doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(98,113,125); doc.text(sous, 12, 39.5); }
  doc.setTextColor(29,43,54);
  return sous? 45 : 40;
}
function piedDoc(doc){
  const n = doc.internal.getNumberOfPages(), w = doc.internal.pageSize.getWidth(), h = doc.internal.pageSize.getHeight();
  for(let i=1;i<=n;i++){ doc.setPage(i); doc.setDrawColor(215,221,227); doc.line(12,h-14,w-12,h-14);
    doc.setFontSize(7.5); doc.setTextColor(98,113,125);
    doc.text('Document généré le '+new Date().toLocaleString('fr-FR')+' — Règlement Intérieur FAS-MUFID, Résolution N°25/AGM/18-12-2025', 12, h-9);
    doc.text('Page '+i+' / '+n, w-12, h-9, {align:'right'}); }
}
function tablePdf(doc, tete, corps, y, opts){
  const net = c => (c && typeof c==='object' && !Array.isArray(c)) ? Object.assign({},c,{content:txtPdf(c.content)}) : txtPdf(c);
  const teteN = (tete||[]).map(net);
  const corpsN = (corps||[]).map(r=>r.map(net));
  doc.autoTable(Object.assign({head:[teteN], body:corpsN, startY:y, theme:'grid',
    styles:{fontSize:7.8, cellPadding:1.9, lineColor:[215,221,227], textColor:[29,43,54], overflow:'linebreak'},
    headStyles:{fillColor:[19,94,151], textColor:255, fontStyle:'bold', fontSize:7.8},
    alternateRowStyles:{fillColor:[248,250,251]}}, opts||{}));
  return doc.lastAutoTable.finalY;
}
/* Sortie d'un PDF : téléchargement automatique ET fenêtre « Document prêt » avec liens directs,
   car certains navigateurs bloquent en silence un téléchargement lancé après un chargement réseau. */
function sortiePdf(doc, nom){
  let url=null; try{ url = URL.createObjectURL(doc.output('blob')); }catch(e){}
  try{ doc.save(nom); }catch(e){}
  toast('Document PDF généré','ok');
  if(url) modale('Document prêt', `<div class="note vert"><b>${esc(nom)}</b>Le téléchargement a été lancé. S’il n’apparaît pas dans vos téléchargements, utilisez les boutons ci-dessous.</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><a class="btn" href="${url}" download="${esc(nom)}">Télécharger le PDF</a>
    <a class="btn s" href="${url}" target="_blank" rel="noopener">Ouvrir dans un nouvel onglet</a></div>`, [{t:'Fermer'}]);
}

/* Compresse une image de signature en JPEG léger (max 420×150, fond blanc) pour un stockage compact.
   Vise ~4-8 Ko par signature : à l'échelle du réseau (96×4), l'ensemble reste raisonnable. */
function compresserSignature(file){
  return new Promise((res,rej)=>{
    if(!file || !/^image\//.test(file.type)){ rej(new Error('Le fichier doit être une image (PNG, JPG…)')); return; }
    if(file.size > 8*1024*1024){ rej(new Error('Image trop volumineuse (max 8 Mo)')); return; }
    const r=new FileReader();
    r.onload=()=>{ const img=new Image();
      img.onload=()=>{ try{
        const maxW=420, maxH=150; let w=img.width, h=img.height;
        const ratio=Math.min(maxW/w, maxH/h, 1); w=Math.max(1,Math.round(w*ratio)); h=Math.max(1,Math.round(h*ratio));
        const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
        const ctx=cv.getContext('2d');
        ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,w,h);     // fond blanc (une signature n'a pas besoin de transparence)
        ctx.drawImage(img,0,0,w,h);
        let data=cv.toDataURL('image/jpeg',0.72);           // JPEG qualité 72 % : bon compromis lisibilité/poids
        // garde-fou : si malgré tout > 120 Ko, on réduit encore la qualité
        if(data.length>120000) data=cv.toDataURL('image/jpeg',0.55);
        res(data);
      }catch(e){ rej(e); } };
      img.onerror=()=>rej(new Error('Image illisible'));
      img.src=r.result; };
    r.onerror=()=>rej(new Error('Lecture impossible'));
    r.readAsDataURL(file);
  });
}
/* Charge les signatures d'UNE MUFID (à la demande) : table dédiée en serveur, mémoire en local.
   Jamais toutes les signatures du réseau d'un coup — robuste à l'échelle (96 × 4). */
async function chargerSignatures(codeMufid){
  const membres = membresComite(codeMufid);
  if(Srv.actif()) return await Srv.signaturesMembres(membres.map(m=>m.id));   // par membre, quel que soit le code de MUFID
  const map={}; membres.filter(m=>m.signature).forEach(m=>{ map[m.id]=m.signature; });
  return map;
}
async function sauverSignature(membreId, codeMufid, dataUrl){
  if(Srv.actif()) await Srv.enregistrerSignature(membreId, codeMufid, dataUrl);
  else { const m=(DB.comites||[]).find(x=>x.id===membreId); if(m){ m.signature=dataUrl; await sauver(true); } }
}
async function retirerSignature(membreId, codeMufid){
  if(Srv.actif()) await Srv.supprimerSignatureSrv(membreId);
  else { const m=(DB.comites||[]).find(x=>x.id===membreId); if(m){ delete m.signature; await sauver(true); } }
}
/* Écran de gestion des spécimens de signature des membres d'un Comité Local de Validation. */
/* ---- Cohérence des comités (1.26) : une MUFID peut figurer sous deux codes (référentiel et fichier
   du comité). On rattache un membre à une MUFID si le code est identique OU si les noms coïncident. ---- */
const nomMufidNorm = c => norm(R.mufidNom(c)||c||'').replace(/^mufid\s+/,'').replace(/[^a-z0-9]/g,'');
function memeMufid(a,b){ return a===b || (!!a && !!b && nomMufidNorm(a)===nomMufidNorm(b)); }
function membresComite(code){
  const ordre={pointFocal:1,controleur:2,directeur:3,comptable:4};
  return (DB.comites||[]).filter(m=>memeMufid(m.mufid, code)).sort((a,b)=>(ordre[a.role]||9)-(ordre[b.role]||9));
}
/* Liste unique des MUFID proposées par les deux modules (comité et signatures), sans doublon. */
function listeMufidsComites(){
  const out=[];
  const ajoute = (code,nom)=>{ if(!code) return; if(out.find(o=>memeMufid(o.code,code))) return; out.push({code, nom:nom||R.mufidNom(code)}); };
  (DB.mufids||[]).forEach(m=>ajoute(m.code, m.nom));      // le référentiel d'abord : son code et son nom font foi
  (DB.comites||[]).forEach(m=>ajoute(m.mufid));
  out.forEach(o=>{ o.n = membresComite(o.code).length; });
  return out.sort((a,b)=>((b.n?1:0)-(a.n?1:0)) || String(a.nom).localeCompare(String(b.nom),'fr'));
}
/* ---- Lecture d'un PDF ou d'une image vers un canevas (formulaire signé scanné) ---- */
async function chargerPdfJs(){
  if(window.pdfjsLib) return window.pdfjsLib;
  await new Promise((res,rej)=>{ const sc=document.createElement('script');
    sc.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    sc.onload=res; sc.onerror=()=>rej(new Error('Lecture des PDF indisponible (vérifiez la connexion)'));
    document.head.appendChild(sc); });
  window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  return window.pdfjsLib;
}
async function fichierVersCanvas(file){
  if(!file) throw new Error('Aucun fichier choisi');
  if(file.type==='application/pdf' || /\.pdf$/i.test(file.name)){
    toast('Lecture du PDF…');
    const lib = await chargerPdfJs();
    const pdf = await lib.getDocument({data: await file.arrayBuffer()}).promise;
    const page = await pdf.getPage(1);
    const vp = page.getViewport({scale:2});
    const cv = document.createElement('canvas'); cv.width=Math.round(vp.width); cv.height=Math.round(vp.height);
    const cx = cv.getContext('2d'); cx.fillStyle='#fff'; cx.fillRect(0,0,cv.width,cv.height);
    await page.render({canvasContext:cx, viewport:vp}).promise;
    return cv;
  }
  if(!/^image\//.test(file.type)) throw new Error('Choisissez une image (JPG, PNG) ou un PDF');
  if(file.size > 20*1024*1024) throw new Error('Fichier trop volumineux (max 20 Mo)');
  const url = URL.createObjectURL(file);
  try{
    const img = await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>rej(new Error('Image illisible')); i.src=url; });
    const cv = document.createElement('canvas'); cv.width=img.naturalWidth; cv.height=img.naturalHeight;
    const cx = cv.getContext('2d'); cx.fillStyle='#fff'; cx.fillRect(0,0,cv.width,cv.height); cx.drawImage(img,0,0);
    return cv;
  } finally { URL.revokeObjectURL(url); }
}
function pivoterCanvas(cv){
  const r=document.createElement('canvas'); r.width=cv.height; r.height=cv.width;
  const c=r.getContext('2d'); c.translate(r.width,0); c.rotate(Math.PI/2); c.drawImage(cv,0,0); return r;
}
/* Réduit une zone découpée au format d'un spécimen (max 420 x 150, JPEG léger). */
function canvasVersSignature(cv){
  const maxW=420, maxH=150; const k=Math.min(maxW/cv.width, maxH/cv.height, 1);
  const w=Math.max(1,Math.round(cv.width*k)), h=Math.max(1,Math.round(cv.height*k));
  const o=document.createElement('canvas'); o.width=w; o.height=h;
  const c=o.getContext('2d'); c.fillStyle='#fff'; c.fillRect(0,0,w,h); c.imageSmoothingQuality='high'; c.drawImage(cv,0,0,w,h);
  let d=o.toDataURL('image/jpeg',0.8); if(d.length>120000) d=o.toDataURL('image/jpeg',0.6); return d;
}
/* Recadrage : tracer un cadre autour de la signature d'un membre, enregistrer, passer au suivant. */
function recadrerSignatures(code, source, membreInitial){
  const membres=membresComite(code);
  if(!membres.length){ toast('Aucun membre de comité pour cette MUFID : importez d’abord le comité','ko'); return; }
  let src=source, sel=null, glisse=null;
  const faits=new Set();
  const opt = m => `<option value="${esc(m.id)}" ${m.id===membreInitial?'selected':''}>${esc(m.nom)} — ${esc((ROLES_COMITE[m.role]||{}).lib||m.role||'')}${faits.has(m.id)?' ✓':''}</option>`;
  modale('Découper les signatures — '+R.mufidNom(code), `
    <div class="note">Choisissez le membre, puis <b>tracez un cadre</b> autour de sa signature avec la souris (ou le doigt). Cliquez « Enregistrer » et passez au membre suivant. Sans cadre, l’image entière est enregistrée. « Pivoter » redresse un formulaire scanné de travers.</div>
    <div class="champ"><label>Membre</label><select id="rcM">${membres.map(opt).join('')}</select></div>
    <div style="overflow:auto;max-height:58vh;border:1px solid var(--ligne);border-radius:6px;background:#fff">
      <canvas id="rcCv" style="display:block;width:100%;touch-action:none;cursor:crosshair"></canvas></div>`,
    [{t:'Terminer', f:()=>{ setTimeout(()=>gererComites(code),0); }},
     {t:'Pivoter ↻', cl:'s', f:()=>{ src=pivoterCanvas(src); sel=null; preparer(); return false; }},
     {t:'Enregistrer la signature', cl:'', f:()=>{
       const id=$('#rcM').value, m=membres.find(x=>x.id===id);          // lu avant tout traitement asynchrone
       let zone=src;
       if(sel && sel.w>8 && sel.h>8){ zone=document.createElement('canvas'); zone.width=Math.round(sel.w); zone.height=Math.round(sel.h);
         zone.getContext('2d').drawImage(src, sel.x, sel.y, sel.w, sel.h, 0, 0, zone.width, zone.height); }
       const data=canvasVersSignature(zone);
       (async ()=>{ try{ await sauverSignature(id, code, data); faits.add(id);
           journal('Signature comité ajoutée', (m?m.nom:id)+' ('+R.mufidNom(code)+')');
           if(Cloud.session) try{ await Cloud.auditer('Signature ajoutée', m?m.nom:id); }catch(e){}
           toast('Signature enregistrée : '+(m?m.nom:''),'ok');
           const selM=$('#rcM'); if(selM){ const suivant=membres.find(x=>!faits.has(x.id));
             selM.innerHTML=membres.map(x=>`<option value="${esc(x.id)}" ${suivant&&x.id===suivant.id?'selected':''}>${esc(x.nom)} — ${esc((ROLES_COMITE[x.role]||{}).lib||x.role||'')}${faits.has(x.id)?' ✓':''}</option>`).join(''); }
           sel=null; dessiner();
         }catch(e){ toast('Échec de l’enregistrement : '+(e.message||e),'ko'); } })();
       return false; }}]);
  let cv, cx;
  function dessiner(){ if(!cv) return; cx.drawImage(src,0,0);
    if(sel){ cx.fillStyle='rgba(27,94,151,0.14)'; cx.fillRect(sel.x,sel.y,sel.w,sel.h);
      cx.strokeStyle='#1B5E97'; cx.lineWidth=Math.max(2,src.width/350); cx.strokeRect(sel.x,sel.y,sel.w,sel.h); } }
  function point(e){ const r=cv.getBoundingClientRect(); return {x:(e.clientX-r.left)*cv.width/r.width, y:(e.clientY-r.top)*cv.height/r.height}; }
  function preparer(){ cv=document.getElementById('rcCv'); if(!cv) return; cx=cv.getContext('2d');
    cv.width=src.width; cv.height=src.height; dessiner();
    cv.onpointerdown=e=>{ e.preventDefault(); cv.setPointerCapture(e.pointerId); glisse=point(e); sel={x:glisse.x,y:glisse.y,w:0,h:0}; dessiner(); };
    cv.onpointermove=e=>{ if(!glisse) return; const p=point(e);
      sel={x:Math.max(0,Math.min(glisse.x,p.x)), y:Math.max(0,Math.min(glisse.y,p.y)), w:Math.abs(p.x-glisse.x), h:Math.abs(p.y-glisse.y)}; dessiner(); };
    cv.onpointerup=()=>{ glisse=null; };
  }
  setTimeout(preparer, 40);
}

/* Import d'un fichier de comité pour LA MUFID choisie (la MUFID du fichier est ignorée). */
async function importerFichierComite(code, file){
  try{
    const ext=file.name.split('.').pop().toLowerCase();
    let lignes = (ext==='xlsx'||ext==='xls'||ext==='csv') ? await lireTableur(file) : ext==='docx' ? await lireWord(file) : ext==='pdf' ? await lirePdf(file) : null;
    if(!lignes) throw new Error('Format non pris en charge (Excel, CSV, Word ou PDF)');
    lignes = lignes.filter(r=>r.some(c=>String(c||'').trim()!==''));
    if(lignes.length<2) throw new Error('Aucun tableau exploitable dans le fichier');
    const iE = trouverEntete(lignes), ent = lignes[iE].map(x=>norm(String(x||'')));
    const col = re => ent.findIndex(h=>re.test(h));
    const cNom=col(/nom/), cFon=col(/qualite|fonction|role|membre|poste/), cCni=col(/cni|identite|carte/), cTel=col(/tel|phone|contact/);
    if(cNom<0) throw new Error('Colonne « Nom et prénom » introuvable');
    const out=[];
    lignes.slice(iE+1).forEach(r=>{ const nom=String(r[cNom]||'').trim(); if(!nom || /^nom/i.test(nom)) return;
      const fonction = cFon>=0 ? String(r[cFon]||'').trim() : '';
      const role = devineRoleComite(fonction) || devineRoleComite(r.join(' '));
      out.push({nom, fonction, role, cni: cCni>=0? String(r[cCni]||'').trim():'', telephone: cTel>=0? String(r[cTel]||'').trim():''}); });
    if(!out.length) throw new Error('Aucun membre lu dans le fichier');
    // même personne déjà enregistrée sous une autre MUFID (import antérieur erroné) : on propose de la déplacer
    out.forEach(v=>{ v.autre = (DB.comites||[]).find(x=>norm(x.nom)===norm(v.nom) && codeReferentiel(x.mufid)!==code && !memeMufid(x.mufid,code)) || null; });
    modale('Vérifier le comité — '+R.mufidNom(code), `
      <div class="note"><b>${out.length} membre(s) lu(s) dans « ${esc(file.name)} »</b> Ils seront enregistrés pour <b>${esc(R.mufidNom(code))}</b>. Corrigez le rôle si nécessaire.</div>
      ${out.some(v=>v.autre)?`<div class="note ambre"><b>Certains membres sont déjà enregistrés sous une autre MUFID</b> (import antérieur). Cochés, ils sont déplacés vers ${esc(R.mufidNom(code))} avec leur signature.</div>`:''}
      <div style="overflow-x:auto"><table class="t"><thead><tr><th>Nom</th><th>Rôle</th><th>N° CNI</th><th>Téléphone</th><th>Déjà enregistré</th></tr></thead><tbody>
      ${out.map((m,i)=>`<tr><td>${esc(m.nom)}<div class="disc">${esc(m.fonction)}</div></td>
        <td><select data-r="${i}">${['',...ROLES_ORDRE].map(r=>`<option value="${r}" ${m.role===r?'selected':''}>${r?esc(ROLES_COMITE[r].lib):'— à préciser —'}</option>`).join('')}</select></td>
        <td>${esc(m.cni)}</td><td>${esc(m.telephone)}</td>
        <td>${m.autre?`<label class="ch"><input type="checkbox" data-mv="${i}" checked> déplacer depuis ${esc(codeReferentiel(m.autre.mufid)?R.mufidNom(m.autre.mufid):'(sans MUFID)')}</label>`:'—'}</td></tr>`).join('')}</tbody></table></div>`,
      [{t:'Annuler', f:()=>{ setTimeout(()=>gererComites(code),0); }},{t:'Enregistrer le comité', cl:'', f:()=>{
        $$('#modale [data-r]').forEach(s=>{ out[+s.dataset.r].role=s.value; });
        $$('#modale [data-mv]').forEach(c=>{ if(!c.checked) out[+c.dataset.mv].autre=null; });
        if(!DB.comites) DB.comites=[];
        const existants = membresComite(code); let ajout=0, maj=0;
        out.forEach(v=>{
          const ex = existants.find(x=>norm(x.nom)===norm(v.nom)) || v.autre;
          if(v.role) membresComite(code).forEach(x=>{ if(x.role===v.role && x!==ex && norm(x.nom)!==norm(v.nom)) x.role=''; });
          if(ex){ Object.assign(ex, {nom:v.nom, fonction:v.fonction||ex.fonction, role:v.role||ex.role, cni:v.cni||ex.cni, telephone:v.telephone||ex.telephone, mufid:code}); maj++; }
          else { DB.comites.push({id:'c'+hash32(norm(code+'|'+v.nom+'|'+v.cni)), mufid:code, nom:v.nom, fonction:v.fonction, role:v.role, cni:v.cni, telephone:v.telephone}); ajout++; } });
        enregistrerComites('Import du comité '+R.mufidNom(code)+' ('+out.length+' membres)')
          .then(()=>{ toast(`${ajout} membre(s) ajouté(s), ${maj} mis à jour — signatures conservées`,'ok'); gererComites(code); })
          .catch(e=>{ toast('Échec de l’enregistrement : '+(e.message||e),'ko'); gererComites(code); });
      }}]);
  }catch(e){ toast('Import impossible : '+(e.message||e),'ko'); }
}

          : `<div class="vide"><b>Aucun comité en base.</b> Importez d’abord les fichiers des comités (« Importer des membres » → onglet « Comités Locaux de Validation ») : les signatures se rattachent ensuite à chaque membre.</div>`);

      <div class="note">Importez le <b>formulaire signé</b> (PDF ou photo) puis découpez la signature de chaque membre, ou importez une image par membre. Le spécimen s’affichera au paiement d’un sinistre pour comparaison visuelle (lutte contre la fraude).
        ${orphelines?`<br><b>${orphelines} signature(s) en base sans membre correspondant</b> : réimportez le fichier du comité sans le modifier pour les rattacher.`:''}</div>
      ${membres.length?`<div style="margin:0 0 12px"><button class="btn" id="sigForm">Importer depuis le formulaire signé (PDF ou image)</button></div>`:''}
      <div id="sigCorps">${corps}</div>
      <input type="file" id="sigFile" accept="image/*,application/pdf,.pdf" style="display:none">`;
  };
  const corpsEl=()=> $('#modale .contenu');
  async function recharger(){ try{ sigs = await chargerSignatures(codeCourant); }catch(e){ sigs={}; toast('Signatures indisponibles : '+(e.message||e),'ko'); }
    const c=corpsEl(); if(c){ c.innerHTML=vue(); brancher(); } }
  function choisirFichier(apres){
    const file=$('#sigFile'); if(!file) return;
    file.onchange=async ()=>{ const f=file.files[0]; file.value=''; if(!f) return;
      try{ const cv=await fichierVersCanvas(f); apres(cv); }catch(e){ toast('Échec : '+(e.message||e),'ko'); } };
    file.click();
  }
  function brancher(){
    const sel=$('#sigMufid'); if(sel) sel.onchange=async ()=>{ codeCourant=sel.value; await recharger(); };
    const bf=$('#sigForm'); if(bf) bf.onclick=()=>choisirFichier(cv=>recadrerSignatures(codeCourant, cv));
    $$('#modale [data-sig]').forEach(b=>b.onclick=()=>{ const id=b.dataset.sig; choisirFichier(cv=>recadrerSignatures(codeCourant, cv, id)); });

      }catch(e){ toast('Échec : '+(e.message||e),'ko'); }
    });

  modale('Spécimens de signature des comités', vue(), [{t:'Fermer'}]);
  setTimeout(recharger, 60);

     bodyStyles:{minCellHeight:20, valign:'middle'},
     didDrawCell: d=>{ if(d.section!=='body' || d.column.index!==5) return; const img = images[d.row.index]; if(!img) return;

  }
  $('#v-comptes').innerHTML = `
  <div class="note"><b>Application centralisée</b>
    Toutes les mises à jour sont effectuées ici, au niveau de l’Union. Les MUFID affiliées n’interviennent pas :

  <div class="bloc"><h2>Rôles et privilèges</h2><div class="corps serre"><div class="tab-enrob"><table class="t">

  <div class="bloc"><h2>Journal d’audit centralisé</h2><div id="uAudit" class="corps serre"><div class="vide">Chargement…</div></div></div>`;

async function chargerListeComptes(){
  try{
    const u = await Cloud.listerUtilisateurs();
    $('#uListe').innerHTML = `<div class="tab-enrob"><table class="t"><thead><tr>
      <th class="nc">Utilisateur</th><th class="nc">Rôle</th><th class="nc">État</th><th class="nc"></th></tr></thead><tbody>
      ${u.map(x=>`<tr><td><b>${esc(x.nom||'—')}</b><div class="disc">${esc(x.email)}</div></td>
        <td><span class="et ${x.role==='admin'?'inf':'neu'}">${(ROLES[x.role]||{}).lib||x.role}</span></td>
        <td>${x.actif!==false?'<span class="et ok">Actif</span>':'<span class="et ko">Désactivé</span>'}</td>
        <td><button class="btn s mini" data-edit="${x.id}">Modifier</button></td></tr>`).join('')}
      </tbody></table></div>`;
    $$('#uListe [data-edit]').forEach(b=>b.onclick=()=>formUtilisateur(u.find(x=>x.id===b.dataset.edit)));

  }catch(e){ $('#uAudit').innerHTML = `<div class="disc" style="padding:12px">Journal d’audit indisponible.</div>`; }

function formUtilisateur(u){
  const edit = u && u.id;
  setTimeout(()=>{ const r=$('#uRole'), z=$('#uMufidZone'); if(r&&z) r.addEventListener('change',()=>{ z.style.display = r.value==='dg_mufid'?'':'none'; }); }, 30);
  const champRole = (sel)=>`<select id="uRole">${Object.entries(ROLES).sort((a,b)=>b[1].rang-a[1].rang).map(([k,r])=>`<option value="${k}" ${sel===k?'selected':''}>${r.lib} — ${r.desc}</option>`).join('')}</select>`;
  modale(edit?'Modifier le compte':'Activer un compte', `
    ${edit? `<div class="note"><b>${esc(u.email)}</b></div>`
      : `<div class="note"><b>Procédure sécurisée</b>L’opérateur crée d’abord son mot de passe (il se connecte une première fois à l’application, ou vous le créez dans Supabase → Authentication). Indiquez ici son e-mail pour l’activer et lui attribuer un rôle. Aucun mot de passe ne transite par cet écran.</div>
      <div class="champ"><label>Adresse e-mail du compte à activer</label><input type="text" id="uEmail" placeholder="operateur@mufidunion.com"></div>`}
    <div class="champ"><label>Nom de l’opérateur</label><input type="text" id="uNom" value="${esc(edit?(u.nom||''):'')}"></div>
    <div class="champ"><label>Rôle et privilèges</label>${champRole(edit?u.role:'lecteur')}</div>
    <div class="champ" id="uMufidZone" style="display:${(edit&&u.role==='dg_mufid')?'':'none'}"><label>MUFID du DG (il ne verra qu’elle)</label>
      <select id="uMufid"><option value="">— choisir —</option>${(DB.mufids||[]).slice().sort((a,b)=>String(a.nom).localeCompare(String(b.nom),'fr')).map(m=>`<option value="${esc(m.code)}" ${edit&&u.mufid===m.code?'selected':''}>${esc(m.nom)}</option>`).join('')}</select></div>
    ${edit? `<label class="ch"><input type="checkbox" id="uActif" ${u.actif!==false?'checked':''}> Compte actif</label>`:''}
    <div class="aide" style="margin-top:10px">Les privilèges sont appliqués côté serveur (RLS) : un rôle ne peut pas être contourné depuis le navigateur.</div>`,
    [ {t:'Annuler'},
      {t:edit?'Enregistrer':'Activer le compte', cl:'', f:async ()=>{
        // Lire TOUS les champs AVANT le premier « await » : la fenêtre se ferme dès que
        // la fonction rend la main, et les champs n'existent alors plus (erreur « null »).
        const nom=$('#uNom').value, role=$('#uRole').value, mufidDG=($('#uMufid')||{}).value||'';
        if(role==='dg_mufid' && !mufidDG){ toast('Choisissez la MUFID du DG','ko'); return false; }
        const actif=edit? $('#uActif').checked : true;
        const email=edit? u.email : $('#uEmail').value.trim().toLowerCase();
        if(!edit && !email){ toast('Adresse e-mail requise','ko'); return false; }
        try{
          if(edit){ await Cloud.majUtilisateur(u.id, role==='dg_mufid'? {nom, role, actif, mufid:mufidDG} : {nom, role, actif});
            journal('Modification compte', u.email+' → '+role+(actif?' (actif)':' (désactivé)')); toast('Compte mis à jour','ok'); }
          else {
            await Cloud.activerUtilisateur(email, nom, role);
            journal('Activation compte', email+' ('+role+')'); toast('Compte activé','ok');
          }
          chargerListeComptes();
        }catch(e){ toast('Échec : '+(e.message||e),'ko'); return false; }
      }} ]);
}
