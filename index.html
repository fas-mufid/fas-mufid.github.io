<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FAS-MUFID — Gestion du Fonds d'Assistance Sociale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">

<style>
:root{
  --encre:#10212E; --encre-2:#1B3446; --bleu:#135E97; --bleu-pale:#E7EFF7;
  --papier:#F3F5F7; --ligne:#D7DDE3; --texte:#1D2B36; --doux:#62717D;
  --vert:#2C6E52; --vert-pale:#E6F1EB; --rouge:#A8322A; --rouge-pale:#FAEAE8;
  --ambre:#B5711A; --ambre-pale:#FBF0E1; --or:#A8801F;
  --r:4px;
  --sans:'Archivo',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --serif:'Source Serif 4',Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans); color:var(--texte); background:var(--papier);
  font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--bleu);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- ossature ---------- */
#app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
#rail{background:var(--encre);color:#DDE5EC;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.marque{padding:18px 18px 14px;border-bottom:1px solid rgba(255,255,255,.1)}
.marque b{display:block;font-family:var(--serif);font-size:21px;font-weight:700;color:#fff;letter-spacing:-.01em}
.marque span{display:block;font-size:11.5px;color:#8FA5B6;margin-top:2px;line-height:1.3}
#rail nav{padding:10px 8px;flex:1}
#rail .grp{font-size:11px;color:#7D93A4;padding:12px 10px 5px;letter-spacing:.02em}
#rail a{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:var(--r);color:#CBD8E2;text-decoration:none;font-size:13.5px;cursor:pointer}
#rail a:hover{background:rgba(255,255,255,.07);color:#fff}
#rail a.on{background:var(--bleu);color:#fff;font-weight:500}
#rail a i{width:16px;text-align:center;font-style:normal;opacity:.85;font-size:13px}
#rail a .lib-court{display:none}   /* le libellé court ne sert qu'en mobile */
#rail a .pastille{margin-left:auto;background:var(--rouge);color:#fff;border-radius:9px;padding:0 6px;font-size:11px;line-height:17px;min-width:18px;text-align:center}
#rail a.on .pastille{background:#fff;color:var(--bleu)}
.piedrail{padding:12px 16px;border-top:1px solid rgba(255,255,255,.1);font-size:11px;color:#7D93A4}

#zone{display:flex;flex-direction:column;min-width:0}
#barre{background:#fff;border-bottom:1px solid var(--ligne);padding:11px 22px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:30;flex-wrap:wrap}
#barre h1{margin:0;font-size:17px;font-weight:600;letter-spacing:-.01em}
#barre .sous{color:var(--doux);font-size:12.5px}
.outils{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
main{padding:22px;max-width:1480px;width:100%}
.vue{display:none}
.vue.on{display:block}

/* ---------- éléments ---------- */
.btn{background:var(--bleu);color:#fff;border:1px solid var(--bleu);padding:6px 12px;border-radius:var(--r);cursor:pointer;font-weight:500;font-size:13px;white-space:nowrap}
.btn:hover{background:#0F5184}
.btn.s{background:#fff;color:var(--texte);border-color:var(--ligne)}
.btn.s:hover{background:var(--papier)}
.btn.d{background:var(--rouge);border-color:var(--rouge)}
.btn.d:hover{background:#8C2822}
.btn.v{background:var(--vert);border-color:var(--vert)}
.btn.v:hover{background:#235A42}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.mini{padding:3px 8px;font-size:12px}
input[type=text],input[type=date],input[type=number],input[type=search],select,textarea{
  border:1px solid var(--ligne);border-radius:var(--r);padding:6px 8px;background:#fff;width:100%}
label.ch{display:flex;gap:7px;align-items:center;cursor:pointer}
label.ch input{width:auto}

.bloc{background:#fff;border:1px solid var(--ligne);border-radius:var(--r);margin-bottom:18px}
.bloc>h2{margin:0;padding:11px 15px;border-bottom:1px solid var(--ligne);font-size:14px;font-weight:600;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bloc>h2 .art{font-weight:400;color:var(--doux);font-size:12px}
.bloc>h2 .droite{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap}
.bloc .corps{padding:15px}
.bloc .corps.serre{padding:0}

.grille{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* ============ TABLETTE ============ */
@media(max-width:1100px) and (min-width:761px){
  #app{grid-template-columns:200px 1fr}
  main{padding:18px}
}

/* ============ SMARTPHONE (optimisation tactile) ============ */
@media(max-width:760px){
  /* 1) Structure : une colonne, le menu passe en BARRE DU BAS fixe */
  #app{grid-template-columns:1fr}
  #zone{min-height:100vh}
  main{padding:14px 12px 86px 12px}   /* marge basse pour laisser place à la barre de navigation */

  /* La marque disparaît en mobile (gain de place) ; le menu devient une barre d'onglets en bas */
  #rail{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;flex-direction:row;
    overflow-x:auto;overflow-y:hidden;z-index:60;border-top:1px solid rgba(255,255,255,.12);
    box-shadow:0 -4px 16px rgba(16,33,46,.22);padding:4px 2px}
  #rail .marque{display:none}
  #rail .piedrail{display:none}
  #rail #nav{display:flex;flex-direction:row;gap:2px;width:100%}
  #rail .grp{display:none}   /* les titres de groupe (Pilotage, Gestion…) n'ont pas de sens dans la barre du bas */
  #rail a{flex-direction:column;gap:3px;font-size:10px;padding:6px 7px;min-width:60px;
    text-align:center;white-space:nowrap;border-radius:8px;min-height:52px;justify-content:center}
  #rail a i{font-size:19px;width:auto;opacity:1}
  #rail a .lib-long{display:none}       /* en mobile : libellé court seulement */
  #rail a .lib-court{display:block}
  #rail a .pastille{position:absolute;margin:0;top:3px;right:8px}
  #rail a{position:relative}

  /* 2) Barre du haut compacte, boutons tactiles */
  #barre{padding:9px 12px;gap:8px}
  #barre h1{font-size:19px}
  .outils{gap:6px;width:100%;margin-left:0}
  .outils #selExercice{flex:1;min-width:120px}
  #barre .btn,.outils .btn{min-height:40px;padding:9px 12px;font-size:13.5px}

  /* 3) Grilles d'indicateurs : une seule colonne */
  .g2,.g3,.g4{grid-template-columns:1fr}
  .ind b{font-size:24px}

  /* 4) Boutons : zone tactile confortable (norme 44px) */
  .btn{min-height:44px;padding:11px 16px;font-size:14.5px}
  .btn.s{min-height:40px;padding:9px 13px}
  .btn.mini{min-height:36px;padding:7px 11px}

  /* 5) Formulaires : champs plus grands, police lisible (évite le zoom auto iOS à 16px) */
  .champ input,.champ select,.champ textarea,input[type=search]{font-size:16px;padding:11px 12px;min-height:46px}
  .champ label{font-size:13px}
  .ch{padding:6px 0}
  .ch input[type=checkbox]{width:22px;height:22px}

  /* 6) Tableaux : défilement horizontal fluide, cellules plus hautes, 1re colonne figée */
  .tab-enrob{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--ligne);border-radius:var(--r)}
  table.t{font-size:14px;min-width:max-content}
  table.t th,table.t td{padding:11px 12px}
  table.t th:first-child,table.t td:first-child{position:sticky;left:0;background:#fff;z-index:1;box-shadow:2px 0 4px rgba(16,33,46,.06)}
  table.t tbody tr:nth-child(even) td:first-child{background:#FAFBFC}
  /* indice visuel « faites défiler » */
  .tab-enrob::after{content:'→ faites glisser pour voir la suite';display:block;font-size:11px;color:var(--doux);
    padding:6px 10px;text-align:right;background:var(--papier);border-top:1px solid var(--ligne)}

  /* 7) Modales (formulaires) : plein écran, confortables */
  #voile{padding:0;align-items:stretch}
  .modale{max-width:100%;width:100%;min-height:100%;border-radius:0}
  .modale .contenu{padding:16px 14px}
  .modale header{padding:14px}
  .modale footer{padding:12px 14px;position:sticky;bottom:0;background:#fff;border-top:1px solid var(--ligne)}
  .modale footer .btn{flex:1;min-height:46px}

  /* 8) Onglets d'import et cartes : pleine largeur */
  .onglets{flex-wrap:wrap}
  .onglets button{flex:1;min-height:42px}
  .grille{grid-template-columns:1fr !important}

  /* 9) Dashboard « position » : empilement lisible */
  .position .flux{gap:14px}
  .position .poste b{font-size:23px}
}

/* position technique — l'élément fort du tableau de bord */
.position{background:var(--encre);color:#fff;border-radius:var(--r);padding:20px 22px;margin-bottom:18px}
.position .flux{display:flex;align-items:flex-end;gap:26px;flex-wrap:wrap}
.position .poste{min-width:150px}
.position .poste em{display:block;font-style:normal;font-size:12px;color:#9DB2C2;margin-bottom:3px}
.position .poste b{font-family:var(--serif);font-size:27px;font-weight:600;letter-spacing:-.02em;display:block;line-height:1.1}
.position .poste small{color:#8FA5B6;font-size:11.5px}
.position .sep{font-size:20px;color:#5A7386;padding-bottom:9px}
.position .solde b{color:#7FD4A6}
.position .solde.neg b{color:#F0968D}
.jauge{margin-top:20px}
.jauge .rail{height:9px;background:rgba(255,255,255,.14);border-radius:5px;position:relative;overflow:visible}
.jauge .val{height:9px;border-radius:5px;background:var(--vert);transition:width .4s}
.jauge .marque-s{position:absolute;top:-4px;width:1px;height:17px;background:rgba(255,255,255,.5)}
.jauge .marque-s span{position:absolute;top:19px;left:-14px;font-size:10.5px;color:#8FA5B6;white-space:nowrap}
.jauge .tete{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;font-size:12.5px;color:#B7C7D4;gap:12px;flex-wrap:wrap}
.jauge .tete b{color:#fff;font-size:15px}

/* indicateurs */
.ind{background:#fff;border:1px solid var(--ligne);border-radius:var(--r);padding:13px 14px}
.ind em{font-style:normal;display:block;font-size:12px;color:var(--doux);margin-bottom:5px}
.ind b{font-size:22px;font-weight:600;letter-spacing:-.02em;display:block;line-height:1.15}
.ind small{display:block;color:var(--doux);font-size:11.5px;margin-top:4px}
.ind.alerte{border-left:3px solid var(--rouge)}
.ind.veille{border-left:3px solid var(--ambre)}
.ind.sain{border-left:3px solid var(--vert)}

/* tableaux */
.tab-enrob{overflow:auto;max-height:none}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{background:var(--papier);text-align:left;padding:8px 10px;border-bottom:1px solid var(--ligne);font-weight:600;font-size:12px;color:#3C4C58;position:sticky;top:0;z-index:2;white-space:nowrap;cursor:pointer}
table.t th.nc{cursor:default}
table.t td{padding:7px 10px;border-bottom:1px solid #EDF0F3;vertical-align:top}
table.t tbody tr:hover{background:#FAFBFC}
table.t td.n,table.t th.n{text-align:right;white-space:nowrap}
table.t tfoot td{font-weight:600;background:var(--papier);border-top:2px solid var(--ligne)}
.vide{padding:30px 16px;text-align:center;color:var(--doux)}
.vide b{display:block;color:var(--texte);margin-bottom:5px;font-size:14px}

.et{display:inline-block;padding:1px 7px;border-radius:20px;font-size:11.5px;font-weight:500;white-space:nowrap;border:1px solid transparent}
.et.ok{background:var(--vert-pale);color:var(--vert);border-color:#C3DFD0}
.et.att{background:var(--ambre-pale);color:var(--ambre);border-color:#EFD9B8}
.et.ko{background:var(--rouge-pale);color:var(--rouge);border-color:#EFC9C5}
.et.neu{background:var(--papier);color:var(--doux);border-color:var(--ligne)}
.et.inf{background:var(--bleu-pale);color:var(--bleu);border-color:#C6DCEE}

.filtres{display:flex;gap:9px;padding:11px 15px;border-bottom:1px solid var(--ligne);flex-wrap:wrap;align-items:center;background:#FCFDFD}
.filtres input,.filtres select{width:auto;min-width:130px}
.filtres .compte{margin-left:auto;color:var(--doux);font-size:12.5px}

.note{background:var(--bleu-pale);border-left:3px solid var(--bleu);padding:10px 13px;border-radius:0 var(--r) var(--r) 0;font-size:13px;margin-bottom:14px}
.note.rouge{background:var(--rouge-pale);border-color:var(--rouge)}
.note.ambre{background:var(--ambre-pale);border-color:var(--ambre)}
.note.vert{background:var(--vert-pale);border-color:var(--vert)}
.note b{display:block;margin-bottom:2px}

/* modale */
#voile{position:fixed;inset:0;background:rgba(16,33,46,.55);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:28px 16px;overflow:auto}
#voile.on{display:flex}
.modale{background:#fff;border-radius:var(--r);width:100%;max-width:880px;box-shadow:0 18px 50px rgba(16,33,46,.3)}
.modale header{padding:13px 18px;border-bottom:1px solid var(--ligne);display:flex;align-items:center;gap:12px}
.modale header h3{margin:0;font-size:15.5px;font-weight:600}
.modale header .x{margin-left:auto;background:none;border:none;font-size:21px;cursor:pointer;color:var(--doux);line-height:1;padding:0 4px}
.modale .contenu{padding:18px;max-height:68vh;overflow:auto}
.modale footer{padding:12px 18px;border-top:1px solid var(--ligne);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

.champ{margin-bottom:12px}
.champ label{display:block;font-size:12.5px;color:#42525E;margin-bottom:4px;font-weight:500}
.champ .aide{font-size:11.5px;color:var(--doux);margin-top:3px}
fieldset{border:1px solid var(--ligne);border-radius:var(--r);padding:13px;margin:0 0 14px}
legend{font-size:12.5px;font-weight:600;padding:0 6px;color:#42525E}

/* étapes sinistre */
.circuit{display:flex;gap:0;margin-bottom:16px;flex-wrap:wrap}
.circuit .pas{flex:1;min-width:140px;border:1px solid var(--ligne);border-right:none;padding:9px 12px;background:#fff}
.circuit .pas:last-child{border-right:1px solid var(--ligne)}
.circuit .pas em{font-style:normal;display:block;font-size:11.5px;color:var(--doux)}
.circuit .pas b{font-size:13px;font-weight:600}
.circuit .pas.fait{background:var(--vert-pale);border-color:#C3DFD0}
.circuit .pas.cours{background:var(--bleu-pale);border-color:#C6DCEE}
.circuit .pas.ko{background:var(--rouge-pale);border-color:#EFC9C5}

.depot{border:2px dashed var(--ligne);border-radius:var(--r);padding:34px 20px;text-align:center;background:#FCFDFD;cursor:pointer}
.depot.survol{border-color:var(--bleu);background:var(--bleu-pale)}
.depot b{display:block;font-size:15px;margin-bottom:5px}
.depot span{color:var(--doux);font-size:13px}

.map-col{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid #EDF0F3}
.map-col .src{font-size:12.5px}
.map-col .src small{display:block;color:var(--doux);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.onglets{display:flex;gap:2px;border-bottom:1px solid var(--ligne);margin-bottom:16px;flex-wrap:wrap}
.onglets button{background:none;border:none;border-bottom:2px solid transparent;padding:8px 13px;cursor:pointer;color:var(--doux);font-size:13.5px}
.onglets button.on{color:var(--bleu);border-bottom-color:var(--bleu);font-weight:600}

#toasts{position:fixed;right:18px;bottom:18px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--encre);color:#fff;padding:10px 15px;border-radius:var(--r);font-size:13px;box-shadow:0 8px 22px rgba(16,33,46,.28);max-width:360px}
.toast.ok{background:var(--vert)} .toast.ko{background:var(--rouge)}

.graf{position:relative;height:230px}
.legende{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--doux);margin-top:9px}
.legende i{width:10px;height:10px;border-radius:2px;display:inline-block;margin-right:5px}

table.t td .lien{color:var(--bleu);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.mono{font-variant-numeric:tabular-nums}
.disc{color:var(--doux);font-size:12px}
.imprime{display:none}
.cloudchip{font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:20px;border:1px solid transparent;white-space:nowrap;cursor:pointer}
.cloudchip.local{background:var(--papier);color:var(--doux);border-color:var(--ligne)}
.cloudchip.ok{background:var(--vert-pale);color:var(--vert);border-color:#C3DFD0}
.cloudchip.sync{background:var(--bleu-pale);color:var(--bleu);border-color:#C6DCEE}
.cloudchip.attente{background:var(--ambre-pale);color:var(--ambre);border-color:#EFD9B8}
.cloudchip.ko{background:var(--rouge-pale);color:var(--rouge);border-color:#EFC9C5}
#connexion{position:fixed;inset:0;background:var(--encre);display:none;align-items:center;justify-content:center;z-index:400;padding:20px}
#connexion.on{display:flex}
.cx-carte{background:#fff;border-radius:8px;max-width:420px;width:100%;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.cx-carte h2{margin:0 0 4px;font-family:var(--serif);font-size:22px}
.cx-carte p{margin:0 0 18px;color:var(--doux);font-size:13px}
.cx-carte .champ{margin-bottom:12px}
.cx-carte .champ label{display:block;font-size:12.5px;color:#42525E;margin-bottom:4px;font-weight:500}
.cx-err{color:var(--rouge);font-size:12.5px;margin-top:8px;min-height:16px}
@media print{#rail,#barre,.outils,.filtres{display:none}#app{display:block}main{padding:0}}
</style>

<div id="app">
  <aside id="rail">
    <div class="marque">
      <b>FAS-MUFID</b>
      <span>Fonds d'assistance sociale<br>Réseau MUFID Union</span>
    </div>
    <nav id="nav"></nav>
    <div class="piedrail" id="piedrail"></div>
  </aside>

  <div id="zone">
    <header id="barre">
      <div>
        <h1 id="titre">Tableau de bord</h1>
        <div class="sous" id="soustitre"></div>
      </div>
      <div class="outils">
        <span id="cloudChip" class="cloudchip local" title="Cliquer pour synchroniser maintenant">Local</span>
        <button class="btn s" id="btnCompte" title="Mon compte : mot de passe, déconnexion" style="display:none">Mon compte</button>
        <select id="selExercice" style="width:auto" title="Exercice comptable"></select>
        <button class="btn s" id="btnSauver">Enregistrer</button>
        <button class="btn s" id="btnSauvegarde">Sauvegarde</button>
      </div>
    </header>
    <main>
      <section class="vue on" id="v-bord"></section>
      <section class="vue" id="v-adherents"></section>
      <section class="vue" id="v-import"></section>
      <section class="vue" id="v-cotisations"></section>
      <section class="vue" id="v-sinistres"></section>
      <section class="vue" id="v-ratios"></section>
      <section class="vue" id="v-mufids"></section>
      <section class="vue" id="v-controle"></section>
      <section class="vue" id="v-rapports"></section>
      <section class="vue" id="v-comptes"></section>
      <section class="vue" id="v-parametres"></section>
      <section class="vue" id="v-mamufid"></section>
    </main>
  </div>
</div>

<div id="voile"><div class="modale" id="modale"></div></div>
<div id="connexion"><div class="cx-carte" id="cxCarte"></div></div>
<div id="toasts"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

/* Hachage déterministe (FNV-1a 52 bits) → id stable pour rapprochement idempotent des imports */
function hash32(s){ s=String(s); let h1=0xdeadbeef^s.length, h2=0x41c6ce57^s.length;
  for(let i=0;i<s.length;i++){ const c=s.charCodeAt(i); h1=Math.imul(h1^c,2654435761); h2=Math.imul(h2^c,1597334677); }
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (4294967296*(2097151&h2)+(h1>>>0)).toString(36); }
/* Clé stable d'un adhérent pour le rapprochement à l'import (idempotence, anti-doublon).
   Matricule prioritaire ; sinon combinaison de tous les champs discriminants disponibles —
   indispensable là où le numéro de compte est partagé (ex. MUFID Union). */
function cleAdherent(f){
  const mat = (f.matricule||'').trim();
  if(mat) return 'a'+hash32(norm((f.mufid||'')+'|m|'+mat));
  const parts = [f.mufid, f.nom, f.prenom, f.compte, f.telephone, f.cni]
    .map(x=>norm(x||'')).join('|');
  return 'a'+hash32(parts);
}

/* Séparateur de milliers : on force l'ESPACE NORMALE (U+0020). toLocaleString insère sinon
   une espace fine insécable (U+202F) que la police PDF n'affiche pas (elle devient « / »). */
const nb = n => (Number(n)||0).toLocaleString('fr-FR').replace(/[\u202F\u00A0]/g,' ');
const fcfa = n => nb(Math.round(Number(n)||0)) + ' F';
const pct = (n,d) => (isFinite(n)&&n!==null) ? (n*100).toFixed(d==null?1:d).replace('.',',')+' %' : '—';
/* Nettoie une chaîne de tout caractère que la police PDF standard ne gère pas (espaces spéciales) */
const txtPdf = s => String(s==null?'':s).replace(/[\u202F\u00A0]/g,' ').replace(/\u2019/g,"'").replace(/[\u2013\u2014]/g,'-');
const norm = s => String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
/* Clé de rapprochement d'un nom pour la détection des cotisations multiples : on retire d'abord

function cleNom(nomComplet){

  return n.replace(/\s+/g,' ').trim();
}

    if(!this.client) return null;
    const [mu, si, me, cnt] = await Promise.all([
      this.client.from('fas_mufids').select('code,data'),
      this.client.from('fas_sinistres').select('id,data'),
      this.client.from('fas_meta').select('cle,data'),
      this.client.from('fas_adherents').select('id',{count:'exact',head:true})
    ]);
    const err = mu.error||si.error||me.error;
    if(err) throw err;
    const meta = {}; (me.data||[]).forEach(r=> meta[r.cle]=r.data);
    this.memoriserBase((mu.data||[]).map(r=>r.data), meta, (si.data||[]).map(r=>r.data));
    return {
      mufids: (mu.data||[]).map(r=>r.data),
      sinistres: (si.data||[]).map(r=>r.data),
      nbAdherents: cnt.count||0,
      params: meta.params || null,
      journal: meta.journal || [],
      tresorerie: meta.tresorerie || [],
      comites: meta.comites || [],
      remboursements: meta.remboursements || {}
    };
  },
  /* État de référence (dernier état lu ou écrit sur le serveur) : permet de n'envoyer que ce que
     CE poste a réellement modifié, et de fusionner avec ce que les autres postes ont enregistré. */
  memoriserBase(mufids, meta, sinistres){
    const J = x => JSON.stringify(x==null?null:x);
    const parId = (arr,k) => { const o={}; (arr||[]).forEach(x=>{ if(x && x[k]!=null) o[x[k]]=J(x); }); return o; };
    const parCle = obj => { const o={}; Object.keys(obj||{}).forEach(k=>{ o[k]=J(obj[k]); }); return o; };
    this._base = { mufids:parId(mufids,'code'), comites:parId(meta.comites,'id'),
      remboursements:parCle(meta.remboursements), params:J(meta.params||null),
      sinistres: sinistres? parId(sinistres,'id') : ((this._base||{}).sinistres||{}) };
  },
  /* Sauvegarde des référentiels légers, PAR FUSION (1.22) :
     - comités, remboursements, MUFID : seules les créations, modifications et suppressions faites
       sur CE poste sont appliquées ; les ajouts des autres postes sont conservés ;
     - paramètres : envoyés seulement s'ils ont été modifiés sur ce poste ;
     - journal et trésorerie : réunion des entrées des deux côtés.
     initial=true : base centrale vide, tout est envoyé. */
  async pushMeta(db, initial){
    if(!this.client) return false;
    const now = new Date().toISOString(), J = x => JSON.stringify(x==null?null:x);
    const base = this._base || {mufids:{}, comites:{}, remboursements:{}, params:null};
    const {data:metaRows, error:eMeta} = await this.client.from('fas_meta').select('cle,data');
    if(eMeta) throw eMeta;
    const srv = {}; (metaRows||[]).forEach(r=>{ srv[r.cle]=r.data; });
    // --- Comités : fusion par identifiant
    const parId = {}; (initial? [] : (srv.comites||[])).forEach(m=>{ if(m&&m.id) parId[m.id]=m; });
    const locaux = {}; (db.comites||[]).forEach(m=>{ if(m&&m.id) locaux[m.id]=m; });
    Object.keys(locaux).forEach(id=>{ if(initial || base.comites[id]!==J(locaux[id])) parId[id]=locaux[id]; });
    Object.keys(base.comites).forEach(id=>{ if(!locaux[id]) delete parId[id]; });
    const comites = Object.values(parId);
    // --- Remboursements : fusion par clé
    const remb = Object.assign({}, initial? {} : (srv.remboursements||{}));
    const rl = db.remboursements||{};
    Object.keys(rl).forEach(k=>{ if(initial || base.remboursements[k]!==J(rl[k])) remb[k]=rl[k]; });
    Object.keys(base.remboursements).forEach(k=>{ if(!(k in rl)) delete remb[k]; });
    // --- Paramètres : seulement si modifiés ici
    const params = (initial || !srv.params || J(db.params)!==base.params) ? db.params : srv.params;
    // --- Journal et trésorerie : réunion sans doublon
    const reunir = (a,b,cap,tri) => { const vus=new Set(), out=[];
      [...(a||[]),...(b||[])].forEach(x=>{ const k=(x&&x.id)||J(x); if(!vus.has(k)){ vus.add(k); out.push(x); } });
      if(tri) out.sort(tri); return cap>0? out.slice(0,cap) : out.slice(cap); };
    const journal = reunir(db.journal, srv.journal, 400, (x,y)=>String(y.date||'').localeCompare(String(x.date||'')));
    const tresorerie = reunir(srv.tresorerie, db.tresorerie, -2000, (x,y)=>String(x.date||'').localeCompare(String(y.date||'')));
    // --- MUFID : n'envoyer que les créations/modifications ; ne supprimer que ce qui a été supprimé ICI
    const mLoc = {}; (db.mufids||[]).forEach(m=>{ mLoc[m.code]=m; });
    const aEcrire = (db.mufids||[]).filter(m=> initial || base.mufids[m.code]!==J(m));
    const aSupprimer = initial? [] : Object.keys(base.mufids).filter(c=>!mLoc[c]);
    const ops = [];
    if(aSupprimer.length) ops.push(this.client.from('fas_mufids').delete().in('code', aSupprimer));
    if(aEcrire.length) ops.push(this.client.from('fas_mufids').upsert(aEcrire.map(m=>({code:m.code, data:m, maj:now}))));
    ops.push(this.client.from('fas_meta').upsert([
      {cle:'params', data:params, maj:now},
      {cle:'journal', data:journal, maj:now},
      {cle:'tresorerie', data:tresorerie, maj:now},
      {cle:'comites', data:comites, maj:now},
      {cle:'remboursements', data:remb, maj:now}
    ]));
    // Sinistres : seuls ceux créés ou modifiés sur ce poste sont envoyés (un poste resté sur un état
    // ancien ne peut plus annuler une validation ou un paiement enregistré ailleurs).
    const sinBase = base.sinistres||{};
    const sinAEcrire = (db.sinistres||[]).filter(x=> initial || sinBase[x.id]!==J(x));
    if(sinAEcrire.length) ops.push(this.client.from('fas_sinistres').upsert(sinAEcrire.map(x=>({id:x.id, data:x, maj:now}))));
    const res = await Promise.all(ops);
    const err = res.find(r=>r.error); if(err) throw err.error;
    // Le poste récupère les ajouts des autres postes, puis la référence est mise à jour.
    db.comites = comites; db.remboursements = remb; db.journal = journal; db.tresorerie = tresorerie;
    if(db===DB){ DB.params = Object.assign({}, PARAM_DEF, params||{}); }
    const [{data:mu},{data:si}] = await Promise.all([this.client.from('fas_mufids').select('code,data'), this.client.from('fas_sinistres').select('id,data')]);
    if(mu){ db.mufids = mu.map(r=>r.data); }
    if(si){ db.sinistres = si.map(r=>r.data); }
    this.memoriserBase(db.mufids, {comites, remboursements:remb, params}, db.sinistres);
    return true;
  }
};

/* =====================================================================
   SRV — accès serveur à grande échelle (jusqu'à 400 000 adhérents)
   Calcul-à-l'écriture : chaque ligne porte ses champs dérivés indexés
   (capital, statut, couvert, cotisation), d'où des agrégats SQL instantanés.
   ===================================================================== */
const Srv = {
  actif(){ return !!(Cloud.client && Cloud.session); },
  LOT: 500,
  /* Projette un adhérent vers une ligne indexée pour le serveur */
  ligne(a){
    const s = R.statut(a), c = R.cot(a)||{};
    return {
      id:a.id, mufid:a.mufid||'', categorie:a.categorie,
      matricule:a.matricule||'', compte:a.compte||'', nom:R.nomComplet(a),
      statut:s.c, couvert: s.c==='COUVERT',
      capital:R.capital(a), cot_du:R.cotisationDue(a), cot_paye:(c.paye||0),
      exercice:DB.params.exercice, age:(age(a.dateNaissance)||null),
      data:a, maj:new Date().toISOString()
    };
  },
  async upsertUn(a){ if(!this.actif()) return; const {error}=await Cloud.client.from('fas_adherents').upsert([this.ligne(a)]); if(error) throw error; },
  async supprimer(id){ if(!this.actif()) return; await Cloud.client.from('fas_adherents').delete().eq('id',id); },
  /* Vide TOUS les adhérents de la base centrale (réservé admin — pour repartir proprement) */
  async viderAdherents(){ if(!this.actif()) return; const {error}=await Cloud.client.from('fas_adherents').delete().neq('id',''); if(error) throw error; },
  /* Supprime TOUS les adhérents d'une MUFID donnée (remplacement d'une caisse). */
  async viderMufid(code){ if(!this.actif()) return 0; const {error}=await Cloud.client.from('fas_adherents').delete().eq('mufid',code); if(error) throw error; return 1; },
  /* Nombre d'adhérents d'une MUFID dans la base. */
  /* Plus grand numéro de matricule généré déjà présent en base pour une MUFID. */
  async matriculesMufid(code){ if(!this.actif()) return {max:0,parId:{}}; let from=0,total=0,max=0; const t=1000, parId={};
    do{ const {data,count,error}=await Cloud.client.from('fas_adherents').select('id,matricule',{count:'exact'}).eq('mufid',code).range(from,from+t-1);
      if(error) throw error; total=count||0;
      (data||[]).forEach(r=>{ parId[r.id]=r.matricule; const m=String(r.matricule||'').match(/(\d+)\s*$/); if(m) max=Math.max(max,+m[1]); });
      from+=t; } while(from<total);
    return {max, parId, total}; },
  async compterMufid(code){ if(!this.actif()) return 0; const {count,error}=await Cloud.client.from('fas_adherents').select('id',{count:'exact',head:true}).eq('mufid',code); if(error) throw error; return count||0; },
  /* Identifiants des adhérents d'une MUFID (pour calculer ceux à retirer lors d'une synchronisation). */
  async idsMufid(code){ if(!this.actif()) return []; let from=0,total=0,out=[];const t=1000;
    do{ const {data,count,error}=await Cloud.client.from('fas_adherents').select('id',{count:'exact'}).eq('mufid',code).range(from,from+t-1);
      if(error) throw error; total=count||0; out=out.concat((data||[]).map(r=>r.id)); from+=t; } while(from<total);
    return out; },
  /* Suppression par lots d'une liste d'identifiants. */
  async supprimerLot(ids, onProgress){ if(!this.actif()||!ids.length) return 0; let n=0;
    for(let i=0;i<ids.length;i+=200){ const chunk=ids.slice(i,i+200);
      const {error}=await Cloud.client.from('fas_adherents').delete().in('id',chunk); if(error) throw error; n+=chunk.length; if(onProgress) onProgress(n,ids.length); }
    return n; },
  /* Écrit une liste par lots de 500, avec rappel de progression */
  async upsertLot(list, onProgress){
    if(!this.actif()) return {ecrits:0};
    // Garantie anti-doublon : un même id n'est écrit qu'une fois (la dernière occurrence l'emporte)
    const vus = {}; list.forEach(a=>{ vus[a.id]=a; });
    const uniq = Object.values(vus);
    let ecrits=0;
    for(let i=0;i<uniq.length;i+=this.LOT){
      const chunk = uniq.slice(i,i+this.LOT).map(a=>this.ligne(a));
      const {error} = await Cloud.client.from('fas_adherents').upsert(chunk);
      if(error) throw error;
      ecrits += chunk.length;
      if(onProgress) onProgress(ecrits, uniq.length);
    }
    return {ecrits};
  },
  /* Page d'adhérents avec recherche / filtre / tri côté serveur */
  /* Récupère TOUS les adhérents de la base centrale, page par page (pour les exports complets). */
  async tousAdherents(onProgress, filtre){
    if(!this.actif()) return [];
    const taille = 1000; let from = 0, total = 0, out = [];
    do {
      let req = Cloud.client.from('fas_adherents').select('data',{count:'exact'});
      if(filtre){ if(filtre.mufid) req=req.eq('mufid',filtre.mufid); if(filtre.cat) req=req.eq('categorie',+filtre.cat); if(filtre.statut) req=req.eq('statut',filtre.statut); }
      const {data, count, error} = await req.order('nom',{ascending:true}).range(from, from+taille-1);
      if(error) throw error; total = count||0;
      out = out.concat((data||[]).map(r=>r.data));
      from += taille;
      if(onProgress) onProgress(Math.min(from,total), total);
    } while(from < total);
    return out;
  },
  async page({q, mufid, cat, statut, tri, sens, page, taille}){
    if(!this.actif()) return {rows:[], total:0};
    taille = taille||50; page = page||0;
    let req = Cloud.client.from('fas_adherents').select('data', {count:'exact'});
    if(mufid) req = req.eq('mufid', mufid);
    if(cat)   req = req.eq('categorie', +cat);
    if(statut)req = req.eq('statut', statut);
    if(q){ const s = q.replace(/[%,]/g,' ').trim(); if(s) req = req.or(`nom.ilike.%${s}%,matricule.ilike.%${s}%,compte.ilike.%${s}%`); }
    const col = {nom:'nom',cat:'categorie',mufid:'mufid',capital:'capital',cotis:'cot_paye',statut:'statut',adhesion:'id'}[tri]||'nom';
    req = req.order(col, {ascending:(sens||1)>0}).range(page*taille, page*taille+taille-1);
    const {data, count, error} = await req;
    if(error) throw error;
    return {rows:(data||[]).map(r=>r.data), total:count||0};
  },
  async parId(id){ if(!this.actif()) return null; const {data,error}=await Cloud.client.from('fas_adherents').select('data').eq('id',id).maybeSingle(); if(error) throw error; return data?data.data:null; },
  /* Agrégats côté serveur via fonction SQL (compte, sommes, ventilations) */
  async agregats(ex, mufid){
    if(!this.actif()) return null;
    const {data, error} = await Cloud.client.rpc('fas_agregats', {p_ex: ex||DB.params.exercice, p_mufid: mufid||null});
    if(error) throw error;
    return data;
  },
  /* Têtes assurées à comptes multiples — non-cumul art. 17 / trop-perçus art. 10 */
  async doublons(ex){
    if(!this.actif()) return null;
    const {data, error} = await Cloud.client.rpc('fas_doublons', {p_ex: ex||DB.params.exercice});
    if(error) throw error;
    return data;
  },
  /* Cotisations multiples : personnes (cat.3) ayant cotisé dans plusieurs MUFID */
  async cotisationsMultiples(ex){
    if(!this.actif()) return null;
    const {data, error} = await Cloud.client.rpc('fas_cotisations_multiples', {p_ex: ex||DB.params.exercice});
    if(error) throw error;    // si la fonction n'existe pas encore (schéma non mis à jour), on remonte l'erreur
    return data;
  },
  /* Signatures des comités : chargées À LA DEMANDE, par MUFID (jamais toutes d'un coup). */
  async signaturesMufid(codeMufid){
    if(!this.actif()) return {};
    const {data, error} = await Cloud.client.from('fas_signatures').select('membre_id,data').eq('mufid', codeMufid);
    if(error) throw error;
    const map={}; (data||[]).forEach(r=>{ map[r.membre_id]=r.data; }); return map;
  },
  async signaturesMembres(ids){
    if(!this.actif() || !ids || !ids.length) return {};
    const {data, error} = await Cloud.client.from('fas_signatures').select('membre_id,data').in('membre_id', ids);
    if(error) throw error;
    const map={}; (data||[]).forEach(r=>{ map[r.membre_id]=r.data; }); return map;
  },
  async enregistrerSignature(membreId, codeMufid, dataUrl){
    if(!this.actif()) return;
    const {error} = await Cloud.client.from('fas_signatures').upsert({membre_id:membreId, mufid:codeMufid, data:dataUrl, maj:new Date().toISOString()});
    if(error) throw error;
  },
  async supprimerSignatureSrv(membreId){
    if(!this.actif()) return;
    const {error} = await Cloud.client.from('fas_signatures').delete().eq('membre_id', membreId);
    if(error) throw error;
  },
  /* Recalcule et réécrit les champs dérivés de tous les adhérents (après changement de barème) */
  async recalculer(onProgress){
    if(!this.actif()) return;
    let from=0, total=0; const taille=1000;
    do {
      const {data, count, error} = await Cloud.client.from('fas_adherents').select('data',{count:'exact'}).range(from, from+taille-1);
      if(error) throw error; total = count||0;
      const lignes = (data||[]).map(r=>this.ligne(r.data));
      if(lignes.length){ const {error:e2}=await Cloud.client.from('fas_adherents').upsert(lignes); if(e2) throw e2; }
      from += taille;
      if(onProgress) onProgress(Math.min(from,total), total);
    } while(from < total);
    return total;
  }
};

/* En mode serveur, DB.adherents n'est qu'un tampon de travail (page courante, membres édités).
   sauver() pousse les référentiels + le tampon ; les gros volumes passent par Srv (import, upsert unitaire). */
async function sauver(silence, adherentsModifies){
  DB.maj = new Date().toISOString();
  const okLocal = await Store.ecrire(Srv.actif()? Object.assign({}, DB, {adherents:[]}) : DB); // en mode serveur on ne cache pas 400k en local
  if(Cloud.client && Cloud.session){
    Cloud.etat='sync'; majCloudChip();
    try{
      await Cloud.pushMeta(DB);
      const lot = adherentsModifies || DB._modifies || [];
      if(lot.length) await Srv.upsertLot(lot);
      DB._modifies = [];
      Cloud.etat='ok'; Cloud.enAttente=false;
    }
    catch(e){ Cloud.etat='attente'; Cloud.enAttente=true; if(!silence) toast('Enregistré en local — synchronisation différée (réseau)','ko'); }
    majCloudChip();
  }
  if(!silence && !(Cloud.client&&Cloud.session)) toast(okLocal?'Données enregistrées':'Enregistrement impossible','ok');
  majPied();
}
/* Marque un adhérent comme modifié pour synchronisation ciblée */
function marquerModifie(a){ DB._modifies = DB._modifies||[]; if(!DB._modifies.find(x=>x.id===a.id)) DB._modifies.push(a); }
async function synchroniser(){
  if(AC.estDG()){ toast('Profil en consultation : données à jour','ok'); return; }
  if(!(Cloud.client && Cloud.session)){ toast('Connectez-vous au cloud pour synchroniser','ko'); return; }
  Cloud.etat='sync'; majCloudChip();
  try{ await Cloud.pushMeta(DB); if((DB._modifies||[]).length){ await Srv.upsertLot(DB._modifies); DB._modifies=[]; }
    Cloud.etat='ok'; Cloud.enAttente=false; toast('Synchronisation réussie','ok'); }
  catch(e){ Cloud.etat='attente'; toast('Échec de synchronisation : '+(e.message||e),'ko'); }
  majCloudChip();
}
async function rafraichir(){
  if(!(Cloud.client && Cloud.session)){ toast('Connectez-vous au cloud d’abord','ko'); return; }
  Cloud.etat='sync'; majCloudChip();
  try{
    const d = await Cloud.pull();
    if(d){ DB = Object.assign(dbVide(), {mufids:d.mufids, adherents:[], sinistres:d.sinistres,
        params:Object.assign({},PARAM_DEF,d.params||{}), journal:d.journal, tresorerie:d.tresorerie, comites:d.comites||[], remboursements:d.remboursements||{}});
      DB.nbAdherents = d.nbAdherents; DB.modeServeur = true;
      if(!DB.mufids) DB.mufids=[];
      MUFIDS_PRESENTES = null;   // recalcul des MUFID réellement présentes
      try{ await reparerReferentielMufids(); }catch(e){}
      Cloud.etat='ok'; toast('Données rafraîchies depuis le serveur','ok');
      majExercices(); aller('bord'); }
  }catch(e){ Cloud.etat='ko'; toast('Rafraîchissement impossible : '+(e.message||e),'ko'); }
  majCloudChip();
}
function majCloudChip(){
  const c = document.getElementById('cloudChip'); if(!c) return;
  const m = { local:['local','Local'], ok:['ok','Synchronisé'], sync:['sync','Synchronisation…'],
    attente:['attente','À synchroniser'], ko:['ko','Cloud hors ligne'] }[Cloud.etat] || ['local','Local'];
  const role = (Cloud.profil && ROLES[Cloud.profil.role]) ? ' · '+ROLES[Cloud.profil.role].lib : '';
  c.className = 'cloudchip '+m[0]; c.textContent = m[1]+role;

}

/* Schéma PostgreSQL à exécuter dans Supabase (SQL Editor) */
const SCHEMA_SQL = `-- =====================================================================
-- FAS-MUFID — base centrale sécurisée (Supabase / PostgreSQL)
-- Application CENTRALISÉE : l'Union gère tout ; comptes à privilèges.
-- À exécuter une fois : Supabase > SQL Editor > New query > Run
-- =====================================================================

-- 0) Extension pour ignorer les accents dans les rapprochements de noms
create extension if not exists unaccent;

-- 1) Données métier
create table if not exists fas_mufids   (code text primary key, data jsonb not null, maj timestamptz default now());
create table if not exists fas_sinistres(id   text primary key, data jsonb not null, maj timestamptz default now());
create table if not exists fas_meta     (cle  text primary key, data jsonb not null, maj timestamptz default now());
-- Spécimens de signature des comités : une ligne par membre, chargée À LA DEMANDE (jamais toutes d'un coup).
-- Séparée de fas_meta pour que les images (plusieurs Mo au total) n'alourdissent pas le chargement courant.
create table if not exists fas_signatures(membre_id text primary key, mufid text, data text not null, maj timestamptz default now());
create index if not exists idx_signatures_mufid on fas_signatures(mufid);

-- Adhérents : colonnes indexées (calcul-à-l'écriture) + JSONB complet.
-- Conçu pour 400 000+ lignes : filtres, tri, pagination et agrégats en SQL.
create table if not exists fas_adherents(
  id text primary key,
  mufid text, categorie int, matricule text, compte text, nom text,
  statut text, couvert boolean,
  capital bigint, cot_du bigint, cot_paye bigint, exercice int, age int,
  data jsonb not null, maj timestamptz default now()
);
create index if not exists idx_ad_mufid  on fas_adherents (mufid);
create index if not exists idx_ad_cat    on fas_adherents (categorie);
create index if not exists idx_ad_statut on fas_adherents (statut);
create index if not exists idx_ad_nom    on fas_adherents (lower(nom) text_pattern_ops);
create index if not exists idx_ad_mat    on fas_adherents (matricule);

-- Fonction d'agrégats (comptes, sommes, ventilations) — réponse en JSON
create or replace function fas_agregats(p_ex int, p_mufid text default null)
returns jsonb language sql stable as $$
  with base as (
    select * from fas_adherents
    where (p_mufid is null or mufid = p_mufid) and statut <> 'RADIE'
  )
  select jsonb_build_object(
    'totaux', (select jsonb_build_object(
        'adherents', count(*),
        'couverts',  count(*) filter (where couvert),
        'csr',       coalesce(sum(capital) filter (where couvert),0),
        'appelee',   coalesce(sum(cot_du) filter (where statut <> 'DECEDE'),0),
        'encaissee', coalesce(sum(cot_paye),0),
        'carence',   count(*) filter (where statut='CARENCE'),
        'carence_capital', coalesce(sum(capital) filter (where statut='CARENCE'),0)
      ) from base),
    'par_mufid', (select coalesce(jsonb_agg(x),'[]'::jsonb) from (
        select mufid as code, count(*) adherents, count(*) filter (where couvert) couverts,
               coalesce(sum(capital) filter (where couvert),0) csr,
               coalesce(sum(cot_du) filter (where statut<>'DECEDE'),0) appelee,
               coalesce(sum(cot_paye),0) encaissee, 0 sinistres, 0 paye
        from base group by mufid) x),
    'par_categorie', (select coalesce(jsonb_agg(jsonb_build_object('categorie',categorie,'n',n)),'[]'::jsonb)
        from (select categorie, count(*) n from base group by categorie) y),
    'par_statut', (select coalesce(jsonb_agg(jsonb_build_object('statut',statut,'n',n)),'[]'::jsonb)
        from (select statut, count(*) n from base group by statut) z),
    'par_age', (select coalesce(jsonb_agg(jsonb_build_object(
          'age_min',a0,'couverts',n,'capital',cap)),'[]'::jsonb)
        from (
          select case when age<30 then 25 when age<40 then 35 when age<50 then 45
                      when age<60 then 55 when age<70 then 65 else 75 end a0,
                 count(*) filter (where couvert) n,
                 coalesce(sum(capital) filter (where couvert),0) cap
          from base where age is not null group by 1) w)
  );
$$;

-- Ventilation MUFID x catégorie (états « MUFID par catégorie » et « Cotisations par catégorie »)
create or replace function fas_mufid_categorie(p_ex int)
returns jsonb language sql stable as $$
  select coalesce(jsonb_agg(x),'[]'::jsonb) from (
    select mufid, categorie, count(*) n,
           coalesce(sum(cot_du) filter (where statut <> 'DECEDE'),0) du,
           coalesce(sum(cot_paye),0) paye
    from fas_adherents where statut <> 'RADIE'
    group by mufid, categorie) x;
$$;

-- 2) Comptes utilisateurs et rôles (liés à l'authentification Supabase)
create table if not exists fas_utilisateurs (
  id    uuid primary key references auth.users(id) on delete cascade,
  email text,
  nom   text,
  role  text not null default 'lecteur',
  actif boolean not null default true,
  maj   timestamptz default now()
);

-- 3) Journal d'audit centralisé (traçabilité des opérations)
create table if not exists fas_audit (
  id bigserial primary key,
  uid uuid default auth.uid(),
  email text,
  action text,
  detail text,
  ts timestamptz default now()
);

-- 4) Fonctions de rôle (SECURITY DEFINER : échappent au RLS pour éviter la récursion)
create or replace function fas_role() returns text language sql stable security definer as $$
  select coalesce((select role from fas_utilisateurs where id = auth.uid() and actif), 'aucun');
$$;
create or replace function fas_rang(r text) returns int language sql immutable as $$
  select case r when 'admin' then 4 when 'gestionnaire' then 3 when 'validateur' then 2
                when 'lecteur' then 1 else 0 end;
$$;
create or replace function fas_peut(min_role text) returns boolean language sql stable as $$
  select fas_rang(fas_role()) >= fas_rang(min_role);
$$;

-- 5) Row Level Security
alter table fas_mufids    enable row level security;
alter table fas_adherents enable row level security;
alter table fas_sinistres enable row level security;
alter table fas_meta      enable row level security;
alter table fas_signatures enable row level security;
alter table fas_utilisateurs enable row level security;
alter table fas_audit        enable row level security;

-- Données métier : lecture = tout authentifié ; écriture = gestionnaire ou plus
do $$
declare t text;
begin
  foreach t in array array['fas_mufids','fas_adherents','fas_sinistres','fas_meta','fas_signatures'] loop
    execute format('drop policy if exists lire_%1$s on %1$s;', t);
    execute format('drop policy if exists ecrire_%1$s on %1$s;', t);
    execute format('create policy lire_%1$s   on %1$s for select to authenticated using (fas_peut(''lecteur''));', t);
    execute format('create policy ecrire_%1$s on %1$s for all    to authenticated using (fas_peut(''gestionnaire'')) with check (fas_peut(''gestionnaire''));', t);
  end loop;
end $$;

-- Comptes : chacun lit son profil ; l'administrateur voit et gère tout
drop policy if exists u_lire on fas_utilisateurs;
drop policy if exists u_self on fas_utilisateurs;
drop policy if exists u_admin on fas_utilisateurs;
create policy u_lire  on fas_utilisateurs for select to authenticated using (id = auth.uid() or fas_peut('admin'));
-- IMPORTANT : l'auto-insertion ne peut JAMAIS attribuer un rôle élevé.
-- Un nouveau compte s'enregistre obligatoirement en 'lecteur' et inactif ;
-- seul un admin (ou l'amorçage ci-dessous) peut promouvoir et activer.
create policy u_self  on fas_utilisateurs for insert to authenticated
  with check (id = auth.uid() and role = 'lecteur' and actif = false);
create policy u_admin on fas_utilisateurs for all    to authenticated using (fas_peut('admin')) with check (fas_peut('admin'));

-- Audit : tout authentifié écrit son action ; l'administrateur lit tout
drop policy if exists a_ins on fas_audit;
drop policy if exists a_lire on fas_audit;
create policy a_ins  on fas_audit for insert to authenticated with check (fas_peut('lecteur'));
create policy a_lire on fas_audit for select to authenticated using (fas_peut('admin'));

-- 6) Amorçage du PREMIER administrateur — par fonction serveur contrôlée (pas par le client).
--    N'accorde 'admin' QUE si la table ne contient encore aucun administrateur actif.
create or replace function fas_amorcer_admin() returns text language plpgsql security definer as $$
declare nb_admin int;
begin
  select count(*) into nb_admin from fas_utilisateurs where role='admin';   -- même désactivé : pas de prise de contrôle
  if nb_admin = 0 then
    insert into fas_utilisateurs(id,email,nom,role,actif)
      values (auth.uid(), (select email from auth.users where id=auth.uid()),
              split_part((select email from auth.users where id=auth.uid()),'@',1), 'admin', true)
      on conflict (id) do update set role='admin', actif=true;
    return 'admin';
  end if;
  return 'lecteur';
end $$;

-- Fiche automatique (inactive) pour chaque compte créé dans Supabase
create or replace function fas_nouveau_compte() returns trigger
language plpgsql security definer set search_path = public as $$
begin
  insert into public.fas_utilisateurs (id, email, nom, role, actif)
  values (new.id, new.email, split_part(new.email, '@', 1), 'lecteur', false)
  on conflict (id) do nothing;
  return new;
end $$;
drop trigger if exists fas_nouveau_compte on auth.users;
create trigger fas_nouveau_compte after insert on auth.users
  for each row execute function fas_nouveau_compte();

-- 7) Détection des têtes assurées à comptes multiples (art. 17 non-cumul / art. 10 trop-perçus)
create or replace function fas_doublons(p_ex int) returns jsonb language sql stable as $$
  with g as (
    select coalesce(nullif(matricule,''), lower(nom)) as cle,
           count(*) n, count(distinct compte) nc,
           sum(cot_paye) paye_total, max(capital) capital_max,
           string_agg(distinct mufid, ', ') mufids
    from fas_adherents where statut <> 'RADIE' and exercice = p_ex
    group by 1 having count(*) > 1 and count(distinct compte) > 1
  )
  select jsonb_build_object(
    'nombre', (select count(*) from g),
    'trop_percu', (select coalesce(sum(paye_total - capital_max/capital_max*2500),0) from g),
    'liste', (select coalesce(jsonb_agg(jsonb_build_object(
        'cle',cle,'comptes',nc,'paye_total',paye_total,'mufids',mufids) order by nc desc),'[]'::jsonb)
      from (select * from g limit 200) t));
$$;

-- 7bis) Cotisations multiples : personnes ayant cotisé (cat. 3) dans PLUSIEURS MUFID.
-- Regroupement sur nom+prénom normalisés (la CNI n'étant pas collectée). Le détail par cotisation
-- permet d'identifier les trop-perçus : on conserve une cotisation, on rembourse les autres.
create or replace function fas_cotisations_multiples(p_ex int) returns jsonb language sql stable as $$
  with base as (
    select id, mufid, nom, compte, matricule, categorie, capital, cot_paye,
           -- clé de rapprochement : minuscules sans accent, ponctuation réduite à l'espace,
           -- puis retrait des titres de civilité (Dr, Pr, M., Mme…) en début/milieu de chaîne
           trim(regexp_replace(
             ' '||regexp_replace(lower(unaccent(coalesce(nom,''))), '[^a-z0-9]+', ' ', 'g')||' ',
             ' (dr|docteur|pr|prof|professeur|m|mr|mme|madame|mlle|mademoiselle|me|maitre|hon|honorable|mgr|rev|sr|fr) ', ' ', 'g'
           )) as cle
    from fas_adherents
    where statut <> 'RADIE' and exercice = p_ex and coalesce(cot_paye,0) > 0   -- TOUTES catégories
  ),
  g as (
    select cle, count(*) n, count(distinct mufid) nm, sum(cot_paye) paye_total,
           max(cot_paye) a_conserver,                 -- on conserve la cotisation la PLUS ÉLEVÉE (capital le plus protecteur)
           jsonb_agg(jsonb_build_object('id',id,'mufid',mufid,'compte',compte,'matricule',matricule,'categorie',categorie,'capital',capital,'paye',cot_paye) order by cot_paye desc) details
    from base group by cle having count(*) > 1          -- plus d'une cotisation (y compris dans une même MUFID)
  )
  select jsonb_build_object(
    'nombre', (select count(*) from g),
    'comptes_total', (select coalesce(sum(n),0) from g),
    'trop_percu_total', (select coalesce(sum(paye_total - a_conserver),0) from g),
    'liste', (select coalesce(jsonb_agg(jsonb_build_object(
        'cle',cle,'cotisations',n,'mufids',nm,'paye_total',paye_total,'a_conserver',a_conserver,'a_rembourser',paye_total-a_conserver,'details',details
      ) order by (paye_total-a_conserver) desc, n desc),'[]'::jsonb) from (select * from g limit 500) t));
$$;

/* Guide de mise en ligne */
const GUIDE_MD = `# FAS-MUFID — mise en ligne

Application de gestion du Fonds d'Assistance Sociale du réseau MUFID, déployable en ligne
comme les applications Tahcure et GAS, avec une base de données centrale (Supabase).

Modèle **centralisé et dimensionné pour 400 000 membres** : toutes les mises à jour se font au niveau de l'Union ;
les MUFID affiliées n'interviennent pas — leurs fichiers Excel sont **intégrés automatiquement par import**
(rapprochement par identifiant stable : un même membre renvoyé est mis à jour, jamais dupliqué). L'accès est gouverné
par des comptes à privilèges. À cette échelle, les adhérents sont stockés dans une table indexée : la liste est
paginée, la recherche et les filtres s'exécutent côté serveur, et les agrégats (tableau de bord, ratios, classement)
sont calculés en SQL — l'application ne charge jamais les 400 000 lignes dans le navigateur.

## 1. Créer la base centrale (Supabase — gratuit)
1. Compte sur https://supabase.com puis **New project** (conservez le mot de passe de la base).
2. **SQL Editor → New query** : collez le contenu de \`FAS-MUFID_schema.sql\` et exécutez (**Run**).
   Le script crée les tables métier, la table des **comptes utilisateurs**, le **journal d'audit** et les
   règles de sécurité (RLS) qui appliquent les privilèges côté serveur.
3. **Project Settings → API** : copiez l'**URL du projet** et la clé **anon public**.

## 2. Relier l'application et créer l'administrateur
1. Ouvrez l'application → **Paramètres → Cloud & déploiement**, collez l'URL et la clé, **Enregistrer et se connecter**.
2. Créez votre compte. Le **tout premier** compte à se connecter est promu **administrateur** par une fonction
   serveur contrôlée (\`fas_amorcer_admin\`), qui n'accorde ce rôle que si aucun administrateur n'existe encore :
   la décision ne vient jamais du navigateur.
3. Dans **Comptes & accès**, activez les comptes des opérateurs et attribuez un rôle à chacun. Chaque opérateur
   crée d'abord son mot de passe en se connectant une première fois (ou vous le créez dans
   Supabase → Authentication → Users) ; aucun mot de passe ne transite par l'application. Un nouveau compte est
   inactif et « lecteur » par défaut tant que vous ne l'avez pas activé.
4. Une fois tous les comptes activés, dans Supabase **Authentication → Providers → Email**, désactivez
   *Enable sign ups* pour fermer toute inscription ultérieure.

## 3. Rôles et privilèges
- **Administrateur** : tout, plus la gestion des comptes et des paramètres.
- **Gestionnaire** : saisie et mise à jour des adhérents, cotisations et sinistres, imports.
- **Validateur** : validation et paiement des sinistres, consultation.
- **Lecteur** : consultation et exports uniquement.
Les droits sont appliqués par le serveur (RLS) : un rôle ne peut pas être contourné depuis le navigateur.
L'auto-inscription d'un compte est contrainte au rôle « lecteur » inactif — impossible de s'auto-promouvoir.

## 4. Héberger le fichier en ligne
Comme pour Tahcure et GAS :
- **GitHub Pages** : déposez le fichier dans un dépôt (renommé \`index.html\`), activez Pages.
- **Netlify** : https://app.netlify.com/drop — glissez le fichier.
- **Votre hébergement** (mufidunion.com…) : téléversez le fichier par FTP.

## 5. Utilisation quotidienne
- Chaque opérateur ouvre l'URL, se connecte, travaille sur les **données centrales** selon son rôle.
- Toute saisie est écrite localement **puis** poussée vers la base : rien n'est perdu, même hors ligne.
- **Rafraîchir depuis le serveur** recharge les données saisies par les autres postes ; **Sauvegarde (.json)** archive l'ensemble.
- Le **fichier de reprise** (.json.gz) se choisit sur le poste depuis *Paramètres → Données* ; il n'est jamais intégré à l'application.

## Sécurité
- Authentification obligatoire + RLS par rôle : lecture pour les comptes autorisés, écriture selon le privilège.
- Auto-promotion impossible : la table des comptes interdit par RLS l'attribution d'un rôle élevé par soi-même.
- Journal d'audit centralisé (table \`fas_audit\`, en ajout seul) : chaque opération est horodatée et attribuée à
  son auteur, lisible par l'administrateur. C'est la source de traçabilité de référence.
- Non-cumul (art. 17) : les têtes assurées à comptes multiples sont détectées par la fonction serveur \`fas_doublons\`.
- La clé *anon* est publique par conception ; ce sont l'authentification et le RLS qui protègent les données.

/* =====================================================================
   MOTEUR DE RÈGLES — Règlement Intérieur FAS-MUFID
   ===================================================================== */
const R = {
  /* art. 9 — cotisation due pour l'exercice */
  cotisationDue(a){
    const p = DB.params.cotisation;
    if(a.categorie===1) return p.c1;
    if(a.categorie===2) return p.c2Base + (a.option? p.c2Option : 0);
    return p.c3;
  },
  partMufid(a){ const p=DB.params.cotisation;
    if(a.categorie===1) return p.c1; if(a.categorie===2) return p.c2Base; return 0; },
  partAdherent(a){ return R.cotisationDue(a) - R.partMufid(a); },

  /* art. 14-16 — capital décès */
  capital(a){
    const b = DB.params.bareme;
    if(a.categorie===3) return b.mutualiste;
    const base = b[a.fonction] || b.personnel;
    if(a.categorie===2) return a.option ? base : Math.round(base*0.5);
    return base;
  },

  /* art. 12-13 — « ancien membre » = adhésion AU PLUS TARD le 31/12/2026 (fin de la période de lancement),
     sans ré-adhésion postérieure. Règle UNIFORME sur tout le réseau, indépendante de la date d'adhésion
     de la MUFID au FAS. Ces membres sont dispensés de période d'attente ET de condition d'âge.
     La case "ancienMembre" de l'import reste honorée. */
  estAncien(a){
    if(a.ancienMembre && !a.dateReadhesion) return true;
    const dep = a.dateReadhesion || a.dateAdhesion;
    if(!dep) return true;                          // sans date connue : considéré présent au lancement
    return iso(dep) <= (DB.params.finLancement || '2026-12-31');
  },

  /* art. 13 — fin de la période d'attente */
  finCarence(a){
    const dep = a.dateReadhesion || a.dateAdhesion;
    if(!dep) return null;
    if(a.categorie===1||a.categorie===2) return iso(dep);              // exonérés (élus, personnel)
    if(R.estAncien(a)) return iso(dep);                                // ancien membre : couverture immédiate
    const ag = age(a.dateNaissance, dep);
    const m = (ag!=null && ag<45) ? DB.params.carenceMoins45 : DB.params.carence45a60;
    return iso(ajouteMois(dep, m));
  },
  moisCarence(a){
    if(a.categorie!==3) return 0;
    if(R.estAncien(a)) return 0;
    const ag = age(a.dateNaissance, a.dateReadhesion||a.dateAdhesion);
    return (ag!=null && ag<45) ? DB.params.carenceMoins45 : DB.params.carence45a60;
  },

  /* art. 12.1 — limite d'âge à l'adhésion (catégorie 3, nouveaux adhérents seulement) */
  eligible(a){
    if(a.categorie!==3) return true;
    if(R.estAncien(a)) return true;                                    // anciens membres : dispensés de la limite d'âge
    const ag = age(a.dateNaissance, a.dateAdhesion);
    return !(ag!=null && ag >= DB.params.ageMaxAdhesion);
  },

  cot(a,ex){ a.cot = a.cot||{}; return a.cot[ex||DB.params.exercice] || null; },
  payee(a,ex){ const c = R.cot(a,ex); return !!c && (c.paye||0) >= R.cotisationDue(a); },

  /* statut de couverture consolidé */
  statut(a, dateRef, ex){
    const d = dateRef || auj(), exo = ex || DB.params.exercice;
    if(a.statut==='decede') return {c:'DECEDE', lib:'Décédé', cl:'neu', motif:'Sinistre enregistré'};
    if(a.statut==='radie')  return {c:'RADIE', lib:'Radié', cl:'neu', motif:a.motif||'Radiation'};
    if(!R.eligible(a)) return {c:'NON_ELIGIBLE', lib:'Non éligible', cl:'ko', motif:"Adhésion à 60 ans ou plus (art. 12.1)"};
    if(a.statut==='suspendu') return {c:'SUSPENDU', lib:'Suspendu', cl:'ko', motif:a.motif||'Suspension administrative'};
    if(a.categorie===3 && (a.solde||0) < DB.params.provisionMin && !R.payee(a,exo))
      return {c:'SUSPENDU', lib:'Suspendu', cl:'ko', motif:"Compte non provisionné : moins de "+fcfa(DB.params.provisionMin)+" au prélèvement (art. 12.3)"};
    if(a.categorie===3 && !a.ancienMembre && a.dateAdhesion){
      const anAdh = new Date(a.dateAdhesion).getFullYear();
      if(exo >= anAdh+1 && (a.mouvements||0) <= R.cotisationDue(a))
        return {c:'SUSPENDU', lib:'Suspendu', cl:'ko', motif:"Aucune activité réelle sur le compte — risque spéculatif (art. 12.2)"};
    }
    if(!R.payee(a,exo)) return {c:'IMPAYE', lib:'Cotisation impayée', cl:'att', motif:"Cotisation "+exo+" non soldée (art. 9)"};
    const fc = R.finCarence(a);
    if(fc && d < fc) return {c:'CARENCE', lib:'En période d’attente', cl:'att', motif:"Couverture effective le "+jour(fc)+" (art. 13)"};
    return {c:'COUVERT', lib:'Couvert', cl:'ok', motif:'Garantie décès active'};
  },

  /* art. 17 — non-cumul : comptes rattachés à une même tête assurée.
     En mode serveur, la liste exhaustive des têtes multi-comptes vient de Srv.doublons() (SQL) ;
     ici on compare sur l'ensemble disponible en mémoire (tampon de page + membres chargés). */
  comptesLies(a){
    const cle = c => (c.cni && norm(c.cni)) || (norm(c.nom+' '+(c.prenom||''))+'|'+(c.dateNaissance||''));
    const k = cle(a);
    const base = Srv.actif() ? (DB._page||[]) : DB.adherents;
    return base.filter(x => x.id!==a.id && cle(x)===k);
  },
  indemnite(a){
    const lot = [a].concat(R.comptesLies(a));
    let best = a, bm = R.capital(a);
    lot.forEach(x => { const c=R.capital(x); if(c>bm){ bm=c; best=x; } });
    return { montant:bm, retenu:best, ecartes:lot.filter(x=>x.id!==best.id) };
  },

  /* personne couverte — art. 18 */
  teteAssuree(a){
    if(a.typePersonne==='morale') return a.personneCouverte || '(dirigeant à désigner)';
    return ((a.prenom||'')+' '+(a.nom||'')).trim();
  },
  libFonction(a){ return a.categorie===3 ? 'Mutualiste' : (FONCTIONS[a.fonction]||{}).lib || '—'; },
  nomComplet(a){ return a.typePersonne==='morale' ? (a.raisonSociale||a.nom||'') : ((a.nom||'')+' '+(a.prenom||'')).trim(); },
  mufidNom(code){ const m = DB.mufids.find(x=>x.code===code); return m? m.nom : (code||'—'); }
};

/* =====================================================================
   AGRÉGATS & RATIOS D'ASSURANCE
   ===================================================================== */
/* Réserve antérieure RÉELLE : nulle au premier exercice (celui du lancement), sinon la valeur paramétrée.
   Empêche toute réserve fantôme de gonfler l'actif net au démarrage du Fonds. */
function reserveAnterieureReelle(ex){
  const anneeLancement = new Date(DB.params.dateLancement||'2026-01-01').getFullYear();
  const exo = ex || DB.params.exercice;
  if(exo <= anneeLancement) return 0;              // au lancement, le séquestre ne contient que les cotisations nettes
  return DB.params.reserveAnterieure || 0;
}
function agreger(ex, codeMufid){
  ex = ex || DB.params.exercice;
  const P = DB.params;
  let ad = DB.adherents.filter(a=>a.statut!=='radie');
  if(codeMufid) ad = ad.filter(a=>a.mufid===codeMufid);
  let sin = DB.sinistres.filter(s => new Date(s.dateDeces).getFullYear()===ex);
  if(codeMufid) sin = sin.filter(s=>s.mufid===codeMufid);

  const st = ad.map(a=>({a, s:R.statut(a,auj(),ex)}));
  const couverts = st.filter(x=>x.s.c==='COUVERT').map(x=>x.a);
  const appelee = ad.reduce((s,a)=> s + (a.statut==='decede'?0:R.cotisationDue(a)),0);
  const encaissee = ad.reduce((s,a)=> s + ((R.cot(a,ex)||{}).paye||0),0);
  const partMufid = ad.reduce((s,a)=> s + (((R.cot(a,ex)||{}).paye||0)>0 ? R.partMufid(a):0),0);

  const payes = sin.filter(s=>s.statut==='paye');
  const instance = sin.filter(s=>['declare','local','central'].includes(s.statut));
  const rejetes = sin.filter(s=>s.statut==='rejete');
  const mtPaye = payes.reduce((s,x)=>s+(x.montant||0),0);
  const provPSAP = instance.reduce((s,x)=>s+(x.montant||0),0);          // sinistres déclarés non réglés

  const csr = couverts.reduce((s,a)=>s+R.capital(a),0);
  // Provision pour risques en cours : membres en période d'attente ayant cotisé (art. 13), couverts au seul risque accidentel
  const enCarence = st.filter(x=>x.s.c==='CARENCE' && R.payee(x.a,ex)).map(x=>x.a);
  const provPREC = enCarence.reduce((s,a)=>s + R.capital(a)*(P.tauxSinistreAccident||0), 0);
  const ibnr = mtPaye * (P.tauxIBNR||0);                                 // sinistres survenus non encore déclarés
  const provisionsTech = provPSAP + provPREC + ibnr;

  // Art. 28 : le séquestre est EXCLUSIVEMENT affecté aux sinistres — aucune charge de fonctionnement ne le grève.
  const gratif = encaissee * P.tauxGratification;                        // art. 30 : affectation d'excédent décidée par le Comité
  const fraisMemo = encaissee * (P.tauxFraisGestion||0);                 // mémo hors séquestre (budget art. 5)
  const budgetFonctMax = encaissee * (P.plafondFonctionnement||0.15);    // budget de fonctionnement du Comité : plafond 15 % des cotisations
  const resultatTech = encaissee - mtPaye - provisionsTech;             // résultat technique du séquestre
  const excedentDistribuable = resultatTech - gratif;                    // excédent après gratification
  // La réserve antérieure ne compte que pour un exercice POSTÉRIEUR au lancement du Fonds.
  // Au premier exercice, le séquestre ne contient que les cotisations nettes : aucune réserve fantôme possible.
  const reserve = reserveAnterieureReelle(ex);
  const actifNet = reserve + encaissee - mtPaye - gratif;               // trésorerie du séquestre

  const sp = encaissee? mtPaye/encaissee : null;
  const combine = encaissee? (mtPaye+provisionsTech+gratif)/encaissee : null;
  const freq = couverts.length ? payes.length/couverts.length : null;   // fréquence observée (rétrospective)
  const capMoy = couverts.length ? csr/couverts.length : 0;
  const primePure = freq!=null ? capMoy*freq : null;                     // prime pure observée
  // Prime pure théorique par table de mortalité (prospective) : Σ capital × q(âge)
  let engagementAttendu = 0, exposition = 0;
  couverts.forEach(a=>{ const g = age(a.dateNaissance); const q = tauxMortalite(g);
    if(q!=null && g!=null){ engagementAttendu += R.capital(a)*q; exposition++; } });
  const primePureTheo = exposition ? engagementAttendu/exposition : null;
  const mortaliteTheo = exposition ? couverts.reduce((s,a)=>{const q=tauxMortalite(age(a.dateNaissance));return s+(q||0);},0)/exposition : null;
  const primeMoy = ad.length ? appelee/ad.length : 0;
  const coutMoy = payes.length ? mtPaye/payes.length : 0;
  const credibiliteFaible = payes.length < (P.seuilCredibilite||30);     // crédibilité de l'expérience propre

  const delaisDecl = sin.filter(s=>s.dateDeclaration).map(s=>heuresEntre(s.dateDeces,s.dateDeclaration));
  const horsDelai = delaisDecl.filter(h=>h>P.delaiDeclarationH).length;
  const delaisRegl = payes.filter(s=>s.datePaiement).map(s=>joursEntre(s.dateDeclaration||s.dateDeces,s.datePaiement));

  const parMufid = {};
  DB.mufids.forEach(m=>{ parMufid[m.code]={code:m.code,nom:m.nom,adherents:0,couverts:0,csr:0,appelee:0,encaissee:0,sinistres:0,paye:0}; });
  ad.forEach(a=>{ const r = parMufid[a.mufid] || (parMufid[a.mufid]={code:a.mufid,nom:R.mufidNom(a.mufid),adherents:0,couverts:0,csr:0,appelee:0,encaissee:0,sinistres:0,paye:0});
    r.adherents++; r.appelee += (a.statut==='decede'?0:R.cotisationDue(a)); r.encaissee += ((R.cot(a,ex)||{}).paye||0);
    if(R.statut(a,auj(),ex).c==='COUVERT'){ r.couverts++; r.csr += R.capital(a); } });
  payes.forEach(s=>{ const r = parMufid[s.mufid]; if(r){ r.sinistres++; r.paye += s.montant||0; } });
  Object.values(parMufid).forEach(r=>{ r.sp = r.encaissee? r.paye/r.encaissee : null;
    r.recouvrement = r.appelee? r.encaissee/r.appelee : null; r.classe = classeMufid(r.sp); });

  const parts = Object.values(parMufid).map(r=>r.csr).filter(x=>x>0);
  const tot = parts.reduce((s,x)=>s+x,0);
  const hhi = tot? parts.reduce((s,x)=>s+Math.pow(x/tot,2),0) : 0;

  const repCat = {1:0,2:0,3:0}, repStatut = {};
  st.forEach(x=>{ repCat[x.a.categorie] = (repCat[x.a.categorie]||0)+1; repStatut[x.s.c]=(repStatut[x.s.c]||0)+1; });

  return { ex, ad, st, couverts, appelee, encaissee, partMufid, payes, instance, rejetes, mtPaye, provPSAP,
    provPREC, ibnr, provisionsTech, enCarence,
    csr, fraisMemo, gratif, budgetFonctMax, resultatTech, excedentDistribuable, sp, combine, freq, capMoy, primePure,
    primePureTheo, mortaliteTheo, engagementAttendu, exposition, credibiliteFaible,
    primeMoy, coutMoy, actifNet,
    tauxRecouvrement: appelee? encaissee/appelee : null,
    tauxRejet: sin.length? rejetes.length/sin.length : null,
    delaiDeclMoy: delaisDecl.length? moyenne(delaisDecl):null, horsDelai, nbDecl:sin.length,
    delaiReglMoy: delaisRegl.length? moyenne(delaisRegl):null,
    couvertureEngagements: provisionsTech? actifNet/provisionsTech : null,
    reserveEnAnnees: engagementAttendu? actifNet/engagementAttendu : null,
    parMufid: Object.values(parMufid), hhi, repCat, repStatut,
    tauxCouverture: ad.length? couverts.length/ad.length : null,
    stopLossAtteint: sp!=null && sp >= P.stopLoss };
}
function classeMufid(sp){
  if(sp==null) return {l:'—',cl:'neu'};
  const P=DB.params;
  if(sp < P.seuilVigilance) return {l:'A — maîtrisée',cl:'ok'};
  if(sp < P.seuilAlerte)    return {l:'B — sous vigilance',cl:'inf'};
  if(sp < P.seuilCritique)  return {l:'C — en alerte',cl:'att'};
  return {l:'D — audit approfondi',cl:'ko'};
}

/* Agrégateur unifié : SQL pour les membres (jusqu'à 400 000) + JS pour les sinistres (peu nombreux).
   Renvoie la même forme que agreger() pour que les vues de pilotage soient identiques. */
async function agregerU(ex, codeMufid){
  ex = ex || DB.params.exercice;
  if(!Srv.actif()) return agreger(ex, codeMufid);     // mode local : moteur en mémoire
  const P = DB.params;
  const g = await Srv.agregats(ex, codeMufid);         // {totaux, par_mufid, par_categorie, par_statut, par_age}
  const t = g.totaux || {};
  const couvertsN = t.couverts||0, adN = t.adherents||0;
  const encaissee = t.encaissee||0, appelee = t.appelee||0, csr = t.csr||0;

  // Côté sinistres : calcul JS sur DB.sinistres (chargés intégralement, volume modéré)
  let sin = DB.sinistres.filter(s=> new Date(s.dateDeces).getFullYear()===ex);
  if(codeMufid) sin = sin.filter(s=>s.mufid===codeMufid);
  const payes = sin.filter(s=>s.statut==='paye'), instance = sin.filter(s=>['declare','local','central'].includes(s.statut)), rejetes = sin.filter(s=>s.statut==='rejete');
  const mtPaye = payes.reduce((s,x)=>s+(x.montant||0),0);
  const provPSAP = instance.reduce((s,x)=>s+(x.montant||0),0);
  const provPREC = (t.carence_capital||0)*(P.tauxSinistreAccident||0);
  const ibnr = mtPaye*(P.tauxIBNR||0); const provisionsTech = provPSAP+provPREC+ibnr;
  const gratif = encaissee*P.tauxGratification; const fraisMemo = encaissee*(P.tauxFraisGestion||0);
  const budgetFonctMax = encaissee*(P.plafondFonctionnement||0.15);
  const resultatTech = encaissee - mtPaye - provisionsTech;
  const excedentDistribuable = resultatTech - gratif;
  const actifNet = reserveAnterieureReelle(ex)+encaissee-mtPaye-gratif;
  const sp = encaissee? mtPaye/encaissee : null;
  const combine = encaissee? (mtPaye+provisionsTech+gratif)/encaissee : null;
  const freq = couvertsN? payes.length/couvertsN : null;
  const capMoy = couvertsN? csr/couvertsN : 0;
  const primePure = freq!=null? capMoy*freq : null;
  // prime pure théorique depuis la ventilation par âge (SQL)
  let engagementAttendu=0, exposition=0, mortSum=0;
  (g.par_age||[]).forEach(b=>{ const q=tauxMortalite(b.age_min); if(q!=null){ engagementAttendu+=(b.capital||0)*q; exposition+=(b.couverts||0); mortSum+=(b.couverts||0)*q; } });
  const primePureTheo = exposition? engagementAttendu/exposition : null;
  const mortaliteTheo = exposition? mortSum/exposition : null;
  const primeMoy = adN? appelee/adN : 0;
  const coutMoy = payes.length? mtPaye/payes.length : 0;
  const credibiliteFaible = payes.length < (P.seuilCredibilite||30);

  const parMufid = (g.par_mufid||[]).map(m=>{ const sp2 = m.encaissee? (m.paye||0)/m.encaissee : null;
    return {code:m.code, nom:R.mufidNom(m.code), adherents:m.adherents||0, couverts:m.couverts||0, csr:m.csr||0,
      appelee:m.appelee||0, encaissee:m.encaissee||0, sinistres:m.sinistres||0, paye:m.paye||0,
      sp:sp2, recouvrement:m.appelee? m.encaissee/m.appelee:null, classe:classeMufid(sp2)}; });
  // injecter les sinistres payés par MUFID (depuis JS)
  payes.forEach(s=>{ const r=parMufid.find(x=>x.code===s.mufid); if(r){ r.sinistres++; r.paye+=s.montant||0; r.sp=r.encaissee? r.paye/r.encaissee:null; r.classe=classeMufid(r.sp); } });
  const parts = parMufid.map(m=>m.csr).filter(x=>x>0); const tot=parts.reduce((a,b)=>a+b,0);
  const hhi = tot? parts.reduce((a,x)=>a+Math.pow(x/tot,2),0):0;
  const repCat={1:0,2:0,3:0}; (g.par_categorie||[]).forEach(c=>repCat[c.categorie]=c.n);
  const repStatut={}; (g.par_statut||[]).forEach(s=>repStatut[s.statut]=s.n);

  const delaisDecl = sin.filter(s=>s.dateDeclaration).map(s=>heuresEntre(s.dateDeces,s.dateDeclaration));
  const horsDelai = delaisDecl.filter(h=>h>P.delaiDeclarationH).length;
  const delaisRegl = payes.filter(s=>s.datePaiement).map(s=>joursEntre(s.dateDeclaration||s.dateDeces,s.datePaiement));

  return { ex, serveur:true, ad:{length:adN}, couverts:{length:couvertsN}, appelee, encaissee,
    payes, instance, rejetes, mtPaye, provPSAP, provPREC, ibnr, provisionsTech, enCarence:{length:t.carence||0},
    csr, fraisMemo, gratif, budgetFonctMax, resultatTech, excedentDistribuable, sp, combine, freq, capMoy, primePure,
    primePureTheo, mortaliteTheo, engagementAttendu, exposition, credibiliteFaible,
    primeMoy, coutMoy, actifNet,
    tauxRecouvrement: appelee? encaissee/appelee:null,
    tauxRejet: sin.length? rejetes.length/sin.length:null,
    delaiDeclMoy: delaisDecl.length? moyenne(delaisDecl):null, horsDelai, nbDecl:sin.length,
    delaiReglMoy: delaisRegl.length? moyenne(delaisRegl):null,
    couvertureEngagements: provisionsTech? actifNet/provisionsTech:null,
    reserveEnAnnees: engagementAttendu? actifNet/engagementAttendu:null,
    parMufid, hhi, repCat, repStatut, parAge:(g.par_age||[]),
    tauxCouverture: adN? couvertsN/adN:null, stopLossAtteint: sp!=null && sp>=P.stopLoss };
}

function ind(t,v,s,cl){ return `<div class="ind ${cl||''}"><em>${t}</em><b>${v}</b>${s?`<small>${s}</small>`:''}</div>`; }
function dessine(id,type,data,opts){
  const el = document.getElementById(id); if(!el || !window.Chart) return;
  if(graphes[id]) graphes[id].destroy();
  opts = Object.assign({responsive:true,maintainAspectRatio:false}, opts||{});
  // Étiquettes de données : configurées via opts.etiquettes ('pct', 'valeur', 'pct+valeur', 'pourcent', 'barre'), sinon désactivées
  const mode = opts.etiquettes; delete opts.etiquettes;
  const fmt = opts.etiquettesFormat; delete opts.etiquettesFormat;
  const plugin = (window.ChartDataLabels && window.Chart) ? [window.ChartDataLabels] : [];
  opts.plugins = opts.plugins || {};
  if(mode && plugin.length){
    const total = (ctx)=> (ctx.chart.data.datasets[ctx.datasetIndex].data||[]).reduce((s,v)=>s+(+v||0),0);
    opts.plugins.datalabels = {
      color: mode==='barre'? '#1D2B36' : '#ffffff',
      anchor: mode==='barre'? 'end':'center', align: mode==='barre'? 'end':'center',
      font:{weight:'600', size: mode==='barre'?11:12},
      clamp:true, clip:false,
      formatter:(v,ctx)=>{
        const n = +v||0; if(n===0 && mode!=='pourcent') return '';
        if(fmt) return fmt(n,ctx);
        const t = total(ctx); const p = t? Math.round(n/t*100):0;
        if(mode==='pct') return p+' %';
        if(mode==='pourcent') return (n*100).toFixed(1).replace('.',',')+' %';
        if(mode==='valeur') return nb(Math.round(n));
        if(mode==='pct+valeur') return nb(Math.round(n))+'\n'+p+' %';
        return nb(Math.round(n));
      },
      textStrokeColor: mode==='barre'? undefined : 'rgba(0,0,0,.35)', textStrokeWidth: mode==='barre'?0:3
    };
  } else {
    opts.plugins.datalabels = {display:false};
  }
  graphes[id] = new Chart(el, {type,data,options:opts, plugins:plugin});
}

let MUFIDS_PRESENTES = null;   // codes de MUFID réellement présents en base (pour les filtres)
/* Référentiel des MUFID toujours complet (1.25) : toute MUFID qui a des adhérents, un comité ou un
   sinistre en base figure dans DB.mufids. Les noms sont repris du cache local du poste s'il les
   connaît ; sinon le code sert de nom (renommable dans « MUFID du réseau »). Les MUFID reconstituées
   sont réenregistrées sur le serveur par un compte autorisé. */
async function reparerReferentielMufids(){
  if(!DB.mufids) DB.mufids=[];
  const connus = new Set(DB.mufids.map(m=>m.code)), manquants = new Set();
  (DB.comites||[]).forEach(m=>{ if(m.mufid && !connus.has(m.mufid)) manquants.add(m.mufid); });
  (DB.sinistres||[]).forEach(x=>{ if(x.mufid && !connus.has(x.mufid)) manquants.add(x.mufid); });
  try{
    if(Srv.actif()){ const g = await Srv.agregats(DB.params.exercice, null);
      (g.par_mufid||[]).forEach(m=>{ if(m.code && !connus.has(m.code)) manquants.add(m.code); }); }
    else (DB.adherents||[]).forEach(a=>{ if(a.mufid && !connus.has(a.mufid)) manquants.add(a.mufid); });
  }catch(e){}
  if(!manquants.size) return 0;
  let cache = null; try{ cache = await Store.lire(); }catch(e){}
  const noms = {}; ((cache&&cache.mufids)||[]).forEach(m=>{ if(m&&m.code) noms[m.code]=m; });
  manquants.forEach(code=>{ DB.mufids.push(noms[code] ? Object.assign({}, noms[code]) : {code, nom:code}); });
  DB.mufids.sort((a,b)=>String(a.nom).localeCompare(String(b.nom),'fr'));
  MUFIDS_PRESENTES = null;
  if(Cloud.session && ['admin','gestionnaire'].includes(AC.role())){
    try{ await Cloud.pushMeta(DB); try{ await Cloud.auditer('Référentiel MUFID réparé', manquants.size+' MUFID reconstituée(s)'); }catch(e){} }catch(e){}
  }
  return manquants.size;
}
/* Retourne [{code,nom,adherents}] des MUFID effectivement présentes (base en mode serveur, mémoire en local) */
async function mufidsPresentes(force){
  if(MUFIDS_PRESENTES && !force) return MUFIDS_PRESENTES;
  if(Srv.actif()){
    try{ const g = await Srv.agregats(DB.params.exercice);
      MUFIDS_PRESENTES = (g.par_mufid||[]).map(m=>({code:m.code, nom:R.mufidNom(m.code), adherents:m.adherents})).filter(m=>m.adherents>0);
    }catch(e){ MUFIDS_PRESENTES = DB.mufids.map(m=>({code:m.code,nom:m.nom,adherents:0})); }
  } else {
    const cpt={}; DB.adherents.forEach(a=>{ cpt[a.mufid]=(cpt[a.mufid]||0)+1; });
    MUFIDS_PRESENTES = Object.keys(cpt).map(code=>({code,nom:R.mufidNom(code),adherents:cpt[code]}));
  }
  // trier par nom
  MUFIDS_PRESENTES.sort((a,b)=>String(a.nom).localeCompare(String(b.nom),'fr'));
  return MUFIDS_PRESENTES;
}

function listeFiltree(){

    if(fAdh.mufid && a.mufid!==fAdh.mufid) return false;
    if(fAdh.statut && R.statut(a).c!==fAdh.statut) return false;
    if(q){ const h = norm([a.nom,a.prenom,a.raisonSociale,a.matricule,a.compte,a.cni,a.personneCouverte].join(' ')); if(!h.includes(q)) return false; }

  const cles = {nom:a=>norm(R.nomComplet(a)), cat:a=>a.categorie, mufid:a=>a.mufid, age:a=>age(a.dateNaissance)||0,
    capital:a=>R.capital(a), cotis:a=>(R.cot(a)||{}).paye||0, statut:a=>R.statut(a).lib, adhesion:a=>a.dateAdhesion||''};
  return tri(l, cles[fAdh.tri]||cles.nom, fAdh.sens);
}
