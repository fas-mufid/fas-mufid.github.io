/* =====================================================================
   REPRISE DU FICHIER OFFICIEL (consolidation des cotisations payées)
   ===================================================================== */
/* Format attendu : {m:[[code,nom]…], e:exercice, a:[[id,matricule,nom,tel,compte,mufid,cat,fonction,paye]…]}
   en JSON, compressé (.json.gz) ou non (.json). */
function validerReprise(s){
  if(s && s.adherents) throw new Error('ceci est une sauvegarde complète : utilisez « Restaurer »');
  if(!s || !Array.isArray(s.m) || !Array.isArray(s.a) || !Number.isInteger(+s.e)) throw new Error('structure inattendue (m, e, a)');
  if(!s.a.length) throw new Error('aucun cotisant dans le fichier');
  s.a.forEach((r,i)=>{ if(!Array.isArray(r) || r.length<9 || !r[0] || !r[5]) throw new Error('ligne '+(i+1)+' incomplète'); });
  s.m.forEach((r,i)=>{ if(!Array.isArray(r) || !r[0]) throw new Error('MUFID '+(i+1)+' incomplète'); });
  s.e = +s.e; return s;
}
async function lireFichierReprise(f){
  const buf = new Uint8Array(await f.arrayBuffer());
  const txt = (buf[0]===0x1f && buf[1]===0x8b)
    ? await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).text()
    : new TextDecoder().decode(buf);
  return validerReprise(JSON.parse(txt.replace(/^\uFEFF/,'')));
}
async function chargerReprise(s, remplace){
  const NOM = {}; s.m.forEach(([c,n])=>NOM[c]=n);
  const mufids = s.m.map(([c,n])=>({code:c,nom:n}));
  const ex = s.e;
  const nouveaux = s.a.map(([id,mat,nom,tel,compte,mufid,cat,fonc,paye])=>({
    id, matricule:mat, nom, prenom:'', raisonSociale:'', typePersonne:'physique', personneCouverte:'', formeMorale:'association',
    dateNaissance:null, sexe:'', cni:'', telephone:tel||'', compte:compte||'', mufid, categorie:cat, fonction:fonc,
    dateAdhesion:'2026-01-01', anneesService:0, solde:0, mouvements:0, option:false, ancienMembre:true,
    statut:'actif', ayantsDroit:[],
    cot:{ [ex]:{du:(cat===3?2500:10000), paye, date:'2026-01-31', mode:'Reprise consolidation', payeur:null} }
  }));
  if(remplace){ DB = dbVide(); DB.params.exercice = ex; }
  // fusionner les MUFID
  mufids.forEach(m=>{ if(!DB.mufids.find(x=>x.code===m.code)) DB.mufids.push(m); });
  // fusionner les adhérents (par id stable → ré-import idempotent)
  const idx = {}; DB.adherents.forEach(a=>idx[a.id]=a);
  let c=0,u=0;
  nouveaux.forEach(a=>{ if(idx[a.id]){ Object.assign(idx[a.id], a); u++; } else { DB.adherents.push(a); c++; } });
  journal('Reprise fichier cotisations', `${c} création(s), ${u} mise(s) à jour`);
  await sauver(false);
  toast(`${nb(c)} adhérents chargés, ${nb(u)} mis à jour`,'ok');
  majExercices(); aller('bord');
}

  const dnaiss=(min,max)=>{ const an=2026-min-Math.floor(Math.random()*(max-min)); return `${an}-${String(1+Math.floor(Math.random()*12)).padStart(2,'0')}-${String(1+Math.floor(Math.random()*27)).padStart(2,'0')}`; };
  // catégorie 1 — actifs
  DB.mufids.forEach(m=>{ fonctions.forEach(([f,cnt])=>{ for(let i=0;i<Math.max(1,Math.round(cnt/2));i++){
    const h=Math.random()>0.5; mk({categorie:1,fonction:f,mufid:m.code,nom:rnd(noms),prenom:h?rnd(prenomsH):rnd(prenomsF),sexe:h?'M':'F',
      dateNaissance:dnaiss(30,58),dateAdhesion:'2026-01-15',telephone:'6'+Math.floor(Math.random()*1e8),cni:'CNI'+Math.floor(Math.random()*1e6)}); } }); });
  // catégorie 2 — retraités
  for(let i=0;i<12;i++){ const h=Math.random()>0.5; mk({categorie:2,fonction:rnd(['elu','personnel','dirigeant']),mufid:rnd(DB.mufids).code,
    nom:rnd(noms),prenom:h?rnd(prenomsH):rnd(prenomsF),sexe:h?'M':'F',dateNaissance:dnaiss(61,78),dateAdhesion:'2026-01-20',
    anneesService:12+Math.floor(Math.random()*18),option:Math.random()>0.6}); }
  // catégorie 3 — mutualistes physiques
  for(let i=0;i<140;i++){ const h=Math.random()>0.5, ancien=Math.random()>0.4, jeune=Math.random()>0.5;
    const adh = ancien? DB.params.dateLancement : rnd(['2026-02-10','2026-03-05','2026-04-18','2026-05-22','2026-06-30']);
    mk({categorie:3,fonction:'mutualiste',mufid:rnd(DB.mufids).code,nom:rnd(noms),prenom:h?rnd(prenomsH):rnd(prenomsF),sexe:h?'M':'F',
      dateNaissance:jeune?dnaiss(22,44):dnaiss(45,72),dateAdhesion:adh,ancienMembre:ancien,compte:'C'+Math.floor(Math.random()*1e7),
      solde:Math.random()>0.1? 2500+Math.floor(Math.random()*90000): Math.floor(Math.random()*2000),
      mouvements:Math.random()>0.15? 5000+Math.floor(Math.random()*400000): Math.floor(Math.random()*2000),
      telephone:'6'+Math.floor(Math.random()*1e8),cni:'CNI'+Math.floor(Math.random()*1e6),_paye:Math.random()>0.12}); }
  // catégorie 3 — personnes morales
  const orgs=[['Association des Planteurs de Bandenkop','association','Fotso Jean'],['GIC Agropastoral du Noun','association','Kamga Paul'],
    ['Société TAHCURE SARL','societe','Nana Victor'],['Entreprise Talla & Fils','societe','Talla Serge'],['Association Femmes Solidaires','association','Ngono Marie']];
  orgs.forEach((o,i)=>mk({categorie:3,fonction:'mutualiste',typePersonne:'morale',raisonSociale:o[0],formeMorale:o[1],personneCouverte:o[2],
    mufid:rnd(DB.mufids).code,dateAdhesion:'2026-01-25',ancienMembre:true,compte:'CM'+(1000+i),solde:50000+Math.floor(Math.random()*200000),mouvements:200000+Math.floor(Math.random()*800000)}));
  // un doublon multi-comptes (art. 17)
  const cible = DB.adherents.find(a=>a.categorie===3 && a.typePersonne==='physique');
  if(cible){ mk({categorie:1,fonction:'elu',mufid:'YDE',nom:cible.nom,prenom:cible.prenom,dateNaissance:cible.dateNaissance,cni:cible.cni,dateAdhesion:'2026-01-15'}); }
  // sinistres — surtout des mutualistes (250 000) + un cas institutionnel, pour un ratio S/P instructif
  const mutu = DB.adherents.filter(a=>a.statut==='actif' && a.categorie===3 && a.typePersonne==='physique');
  const inst = DB.adherents.filter(a=>a.statut==='actif' && a.categorie!==3);
  const echantillon = [];
  [0,1,2].forEach(()=>{ const a=mutu[Math.floor(Math.random()*mutu.length)]; if(a && !echantillon.includes(a)) echantillon.push(a); });
  const ins=inst[Math.floor(Math.random()*inst.length)]; if(ins) echantillon.push(ins);
  const m4=mutu[Math.floor(Math.random()*mutu.length)]; if(m4 && !echantillon.includes(m4)) echantillon.push(m4);
  echantillon.forEach((a,i)=>{ const ev=evalSinistre(a,'2026-0'+(3+i)+'-12','',i===3?'Accident de circulation':'Maladie');
    const s={id:uid('s'),adherentId:a.id,nomAssure:R.nomComplet(a),mufid:a.mufid,categorie:a.categorie,dateDeces:'2026-0'+(3+i)+'-12',
      dateDeclaration:'2026-0'+(3+i)+'-'+(i>2?'16':'13'),causeDeces:i===3?'Accident de circulation':'Maladie',exclusion:null,
      montant:ev.montant,beneficiaire:'Ayant droit '+R.nomComplet(a),lien:'Conjoint',analyse:ev,statut:ev.recevable?(i<3?'paye':'declare'):'rejete',
      motifRejet:ev.recevable?null:ev.motif};
    if(s.statut==='paye'){ s.niveau1={pointFocal:'Point focal '+a.mufid,membreCS:'CS '+a.mufid,directeur:'Directeur '+a.mufid,comptable:'Comptable '+a.mufid,vise:true,date:s.dateDeclaration};
      s.niveau2={signatures:true,valide:true,date:s.dateDeclaration}; s.datePaiement='2026-0'+(3+i)+'-25'; s.paiement={date:s.datePaiement,mode:'Chèque',beneficiaire:s.beneficiaire,sigDg:true,sigPc:true,sigAdm:false}; s.decharge={signee:true};
      tresor('Indemnité décès — '+s.nomAssure,s.montant,s.datePaiement,'debit'); }
    DB.sinistres.push(s); a.statut='decede'; });
  DB.adherents.forEach(a=>{ const c=R.cot(a); if(c&&c.paye) tresor('Cotisation 2026 — '+R.nomComplet(a),c.paye,c.date); });
  DB.params.reserveAnterieure = 0;   // le Fonds démarre sans réserve : l'actif net = cotisations − sinistres − gratification
  journal('Chargement de la démonstration', DB.adherents.length+' adhérents, '+DB.sinistres.length+' sinistres');
  sauver(true); toast('Jeu de démonstration chargé','ok'); majExercices(); aller('bord');
}

/* =====================================================================
   EXERCICES & INITIALISATION
   ===================================================================== */
function majExercices(){
  const anneeLancement = new Date(DB.params.dateLancement||'2026-01-01').getFullYear();  // le Fonds n'existe pas avant
  const cur = new Date().getFullYear();
  const ans = new Set([DB.params.exercice]);
  DB.adherents.forEach(a=>Object.keys(a.cot||{}).forEach(k=>ans.add(+k)));
  DB.sinistres.forEach(s=>ans.add(new Date(s.dateDeces).getFullYear()));
  ans.add(cur);
  // on ne propose aucune année antérieure au lancement du Fonds
  const l = Array.from(ans).filter(x=>x>=anneeLancement && x<=cur+1).sort((a,b)=>b-a);
  if(!l.length) l.push(anneeLancement);
  if(DB.params.exercice < anneeLancement) DB.params.exercice = anneeLancement;
  $('#selExercice').innerHTML = l.map(a=>`<option value="${a}" ${a===DB.params.exercice?'selected':''}>Exercice ${a}</option>`).join('');
}
$('#selExercice').onchange = e=>{ DB.params.exercice = +e.target.value; sauver(true);
  const r={bord:rendBord,adherents:rendAdherents,cotisations:rendCotisations,sinistres:rendSinistres,ratios:rendRatios,mufids:rendMufids,controle:rendControle,rapports:rendRapports}[VUE];
  if(r) r(); majPied(); };
$('#btnSauver').onclick = ()=>sauver(false);
$('#btnSauvegarde').onclick = ()=>{ aller('parametres'); setTimeout(()=>{ const b=$$('#ongParam button').find(x=>x.dataset.o==='donnees'); if(b) b.click(); },50); };

function ecranConnexion(force){
  const c = Cloud;
  $('#cxCarte').innerHTML = `
    <h2>FAS-MUFID en ligne</h2>
    <p>Connectez-vous pour accéder aux données centralisées du Fonds.</p>
    <div class="disc" style="margin:-6px 0 12px">Version ${APP_VERSION} · ${APP_DATE}</div>
    ${!c.dispo()? `<div class="note ambre" style="margin-bottom:14px"><b>Cloud non configuré</b>
      Renseignez l’adresse du projet et la clé publique, ou continuez en mode local.</div>
      <div class="champ"><label>URL du projet Supabase</label><input type="text" id="cxUrl" placeholder="https://xxxx.supabase.co" value="${esc(c.cfg.url)}"></div>
      <div class="champ"><label>Clé publique (anon)</label><input type="text" id="cxKey" placeholder="eyJhbGci…" value="${esc(c.cfg.key)}"></div>
      <button class="btn" id="cxConf" style="width:100%;margin-bottom:10px">Enregistrer la configuration</button>`
    : `<div class="champ"><label>Adresse e-mail</label><input type="text" id="cxEmail" placeholder="vous@mufidunion.com"></div>
      <div class="champ"><label>Mot de passe</label><input type="password" id="cxPwd"></div>
      <button class="btn" id="cxLogin" style="width:100%">Se connecter</button>
      <div class="cx-err" id="cxErr"></div>
      <div style="display:flex;justify-content:space-between;margin-top:10px;font-size:12.5px">
        <span class="lien" id="cxReconf" style="color:var(--bleu);cursor:pointer">Changer de projet</span>
      </div>`}
    <div style="border-top:1px solid var(--ligne);margin-top:16px;padding-top:14px;text-align:center">
      <span class="lien" id="cxLocal" style="color:var(--doux);cursor:pointer;font-size:12.5px">Continuer en mode local (données sur ce poste)</span>
    </div>`;
  $('#connexion').classList.add('on');
  if($('#cxConf')) $('#cxConf').onclick = ()=>{ const u=$('#cxUrl').value, k=$('#cxKey').value;
    if(!u||!k){ toast('URL et clé requises','ko'); return; } c.configurer(u,k); ecranConnexion(true); };
  if($('#cxReconf')) $('#cxReconf').onclick = ()=>{ c.cfg={url:'',key:''}; LS.set('fasmufid:cloud',c.cfg); c.client=null; ecranConnexion(true); };
  if($('#cxLogin')) $('#cxLogin').onclick = async ()=>{
    const err=$('#cxErr'); err.textContent='Connexion…';
    try{ await c.login($('#cxEmail').value.trim(), $('#cxPwd').value); await demarrerCloud(); $('#connexion').classList.remove('on'); }
    catch(e){ err.textContent = 'Échec : '+(e.message||'identifiants invalides'); }
  };
  $('#cxLocal').onclick = ()=>{ Cloud.etat='local'; majCloudChip(); $('#connexion').classList.remove('on'); };
}
async function demarrerCloud(){
  Cloud.etat='sync'; majCloudChip();
  try{
    const d = await Cloud.pull();
    const serveurRenseigne = d && (d.nbAdherents || d.mufids.length || (d.comites||[]).length || d.params);
    if(serveurRenseigne){
      // Mode serveur : les données centrales font foi (le cache local n'est qu'un secours hors ligne).
      DB = Object.assign(dbVide(), {mufids:d.mufids, adherents:[], sinistres:d.sinistres,
        params:Object.assign({},PARAM_DEF,d.params||{}), journal:d.journal, tresorerie:d.tresorerie,
        comites:d.comites||[], remboursements:d.remboursements||{}});
      DB.nbAdherents = d.nbAdherents; DB.modeServeur = true; MUFIDS_PRESENTES = null;
      try{ const n = await reparerReferentielMufids(); if(n) toast(n+' MUFID reconstituée(s) dans le référentiel','ok'); }catch(e){}
    } else if(d){
      // Base centrale vide : on l'initialise avec l'état local courant (référentiels et adhérents).
      await Cloud.pushMeta(DB, true);
      if((DB.adherents||[]).length) await Srv.upsertLot(DB.adherents);
    }
    if(!DB.mufids) DB.mufids=[];
    await Store.ecrire(Srv.actif()? Object.assign({}, DB, {adherents:[]}) : DB); Cloud.etat='ok';
  }catch(e){ Cloud.etat='ko'; toast('Chargement cloud impossible : '+(e.message||e),'ko'); }
  majCloudChip(); majExercices(); aller('bord'); majPied();
}

async function init(){
  const chargee = await Store.lire();          // 1) cache local instantané
  DB = chargee ? Object.assign(dbVide(), chargee) : dbVide();
  DB.params = Object.assign({}, PARAM_DEF, DB.params||{});
  if(!DB.mufids) DB.mufids = [];
  majNav(); majExercices(); aller('bord'); majPied();

  // 2) cloud : si configuré, on tente d'ouvrir la session existante puis on synchronise
  if(Cloud.dispo()){
    Cloud.init();
    const s = await Cloud.session_();
    if(s){ await demarrerCloud(); }        // session valide → données centrales
    else { ecranConnexion(); }             // configuré mais non connecté → écran de connexion
  } else {
    majCloudChip();
    if(!DB.adherents.length){
      setTimeout(()=>{ const el = document.querySelector('#v-bord');
        if(el && VUE==='bord'){ el.insertAdjacentHTML('afterbegin', `<div class="note vert" style="margin-bottom:18px"><b>Bienvenue dans la gestion du FAS-MUFID</b>
          Pour un usage partagé en ligne, configurez la connexion cloud dans « Paramètres → Cloud & déploiement ». Sinon, importez votre fichier de membres ou chargez la démonstration.</div>`); }
      }, 60);
    }
  }
}
const chipEl = document.getElementById('cloudChip');
// La pastille d'état synchronise (connecté) ou ouvre la connexion (non connecté) ;
// « Mon compte » a son propre bouton et n'apparaît plus à chaque synchronisation.
if(chipEl){ chipEl.style.cursor='pointer'; chipEl.onclick = ()=>{ if(Cloud.session) synchroniser(); else ecranConnexion(); }; }
const btnCompte = document.getElementById('btnCompte');
if(btnCompte) btnCompte.onclick = ()=>{ if(Cloud.session) monCompte(); else ecranConnexion(); };
/* Mon compte : chaque utilisateur peut changer son propre mot de passe */
function monCompte(){
  const p = Cloud.profil || {}, em = (Cloud.session && Cloud.session.user.email) || '';
  const btns = [{t:'Fermer'}];
  if(AC.estAdmin()) btns.push({t:'Paramètres cloud', cl:'s', f:()=>{ aller('parametres'); setTimeout(()=>{ const b=$$('#ongParam button').find(x=>x.dataset.o==='cloud'); if(b) b.click(); },50); }});
  btns.push({t:'Se déconnecter', cl:'s', f:async ()=>{ await Cloud.logout(); toast('Déconnecté','ok'); majEtatCloud(); ecranConnexion(); }});
  btns.push({t:'Changer mon mot de passe', cl:'', f:()=>{ setTimeout(changerMotDePasse, 0); }});
  modale('Mon compte', `<div class="note"><b>${esc(p.nom||em)}</b>${esc(em)}${p.role&&ROLES[p.role]?' · '+esc(ROLES[p.role].lib):''}</div>
    <div class="disc">Application FAS-MUFID · version ${APP_VERSION} du ${APP_DATE}</div>`, btns);
}
function changerMotDePasse(){
  modale('Changer mon mot de passe', `
    <div class="champ"><label>Nouveau mot de passe</label><input type="password" id="mdp1" autocomplete="new-password"></div>
    <div class="champ"><label>Confirmer le nouveau mot de passe</label><input type="password" id="mdp2" autocomplete="new-password"></div>
    <div class="aide">8 caractères minimum. Choisissez un mot de passe personnel, que vous ne communiquez à personne.</div>`,
    [{t:'Annuler'},{t:'Enregistrer', cl:'', f:()=>{
      // contrôle synchrone : la fenêtre reste ouverte si la saisie est incorrecte
      const a=$('#mdp1').value, b=$('#mdp2').value;
      if(a.length<8){ toast('8 caractères minimum','ko'); return false; }
      if(a!==b){ toast('Les deux saisies ne correspondent pas','ko'); return false; }
      (async ()=>{ try{ const {error} = await Cloud.client.auth.updateUser({password:a}); if(error) throw error;
        await Cloud.auditer('Changement de mot de passe', 'par l’utilisateur'); toast('Mot de passe modifié','ok');
      }catch(e){ toast('Échec : '+(e.message||e),'ko'); } })();
    }}]);
}
console.info('FAS-MUFID version '+APP_VERSION+' du '+APP_DATE);
/* Alerte « nouvelle version disponible » : relit la page publiée (sans cache) toutes les 10 min
   et au retour sur l'onglet ; propose de recharger si le numéro a changé. */
(function veilleVersion(){
  let alerte=false;
  const verifier = async ()=>{
    if(alerte || !/^https?:/.test(location.protocol)) return;
    try{ const r = await fetch(location.pathname+'?v='+Date.now(), {cache:'no-store'}); if(!r.ok) return;
      const m = (await r.text()).match(/const APP_VERSION = '([^']+)'/);
      if(m && m[1]!==APP_VERSION){ alerte=true;
        const b=document.createElement('div');
        b.setAttribute('role','alert');
        b.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:9999;background:#1B5E97;color:#fff;padding:10px 14px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.25);font-size:14px;display:flex;gap:12px;align-items:center;max-width:92vw';
        b.innerHTML='<span>Nouvelle version '+esc(m[1])+' disponible (vous utilisez la '+esc(APP_VERSION)+').</span>';
        const k=document.createElement('button'); k.className='btn'; k.textContent='Recharger';
        k.onclick=async ()=>{ try{ if(typeof synchroniser==='function' && Cloud.session) await synchroniser(); }catch(e){} location.reload(); };
        b.appendChild(k); document.body.appendChild(b); } }catch(e){}
  };
  setInterval(verifier, 10*60*1000); setTimeout(verifier, 30*1000);
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) verifier(); });
})();
/* Déconnexion automatique après 30 minutes d'inactivité (postes partagés). */
(function veilleInactivite(){
  const DELAI = 30*60*1000; let dernier = Date.now();
  ['mousemove','mousedown','keydown','touchstart','scroll'].forEach(ev=>document.addEventListener(ev, ()=>{ dernier=Date.now(); }, {passive:true}));
  setInterval(async ()=>{
    if(!Cloud.session || Date.now()-dernier < DELAI) return;
    dernier = Date.now();
    try{ await synchroniser(); }catch(e){}
    try{ await Cloud.logout(); }catch(e){}
    try{ majEtatCloud(); }catch(e){}
    ecranConnexion();
    toast('Session fermée après 30 minutes d’inactivité','ok');
  }, 60*1000);
})();
init();
})();
</script>
